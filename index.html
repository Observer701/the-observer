<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Observer and The Guides · companion (2026-11-08 v12.1)</title><style>body{margin:0}</style></head><body><div id="root"></div><script>var __OBS10={"U": [["Author\u2019s Note: Who Is Telling This", "This part of the book is told in the fourth person. The first book was John speaking; this one is told by the part of him that watches. It watches John living, it watches John watching himself, and every so often it catches itself in the act of watching and says so. He is aware that he is aware that he is aware. That is the voice. When you read he, it means John. When you read the one who watches, it means the observer telling the story. Where John\u2019s own words appear, they come from his journals and are his, inside the frame. The guides who helped him are named, but what they gave him is told as what he came to see, so that you can come to your own conclusions alongside him."], ["Opening: Fifty Years, Then a Paintbrush", "For fifty years he built outward. Companies, buildings, a portfolio, a name. The one who watches can see it plainly now: almost every brick was laid with one eye on how other people would judge it. He measured himself by what could be seen from the street. Wealth was the scoreboard, and the scoreboard was always someone else\u2019s eyes.\nWhenever the anxiety built, he opened a new spreadsheet and called it I AM HERE. Everything he owned, everything he owed, and the number between them. The name was the point. I am here. I exist. Do not forget me. The one who watches sees what he could not: the number was never about money. It was a man making sure he would not disappear.\nIn November 2025 he picked up a paintbrush and put the nine-year-old boy on the wall. Not to silence him. To sit with him, and let him have the wall. The canvas did not care about his portfolio, and for the first time the work turned inward.\nIt took him fifty years to find that the work he had never done was inside.\nThe one who watches did not exist yet, or not enough to speak. In a profile he sat in 2022, the capacity to step back and see his own experience without the emotion running it was the quietest thing in him by a long way. This book is that capacity, growing, telling the story as it grows. He is aware. He is aware that he is aware. And somewhere behind that, the one who watches is aware of being aware that he is aware.\nAt the end of the first book he left a question where anyone could see it. If I am not burning, am I nothing? He meant it. What follows is not an answer written from the far side. It is written from inside the change, while it is happening, and some of it will be wrong by the time it is read. Some of it he will have forgotten he believed. The one who watches has decided to leave those parts in. Its job is to record what was true at the time.\nHe spent his life grading the movie while it was still being made. Here, someone is finally watching it. And now and then the one who watches notices that it, too, is being watched.\nThe people who walked beside him through these years did not make him richer. What they helped him see had never once appeared on a balance sheet: internal balance. That the sound is data and the suffering is the story he writes about it. That rest is not a threat. That worth cannot be acquired. That the inner self, not the outer one, is where the work is.\nThere is no finish line. It is a road towards growth and acceptance, walked one ordinary day at a time. If there is a reason to tell it, it is that somebody else, in their own noise, might find a way through by watching how he found his."], ["1. The Scoreboard", "The I AM HERE files go back to April 2014.\nA spreadsheet. His name at the top, the date, everything he owned, everything he owed, and the number sitting between them. Across twelve years, whenever the anxiety built to the point where he needed a figure for what was real, he opened a new one.\nHe never called them net worth statements. The name was the point. I am here. I exist. I have proof.\nThe one who watches can see what he could not. He needed the outside world to tell him where he stood, and the proof never lasted. A good fortnight had stopped counting by the time he opened the file again. The number was how he knew the nine-year-old sweeping floors for five dollars had not come back to take it all away.\nThey were never financial documents. They were proof of life, written for an audience of one man who never believed it.\nThe diaries say the same thing ten years earlier, in his own hand. On 2 September 2015 he headed a page Be Important and wrote that he wanted to be important, just like everyone else. Underneath he listed two things: \u201cThe Desire to be Important\u201d and \u201cThe Craving to be appreciated.\u201d He ended the page with an instruction to himself: give freely to receive freely.\nThe one who watches reads that page now and sees the I AM HERE files from the other side. The spreadsheet was the desire to be important, counted. The craving to be appreciated never had a column.\nThe work now is for him to know where he stands without counting. He is not there. But one week he went without opening the file, and he noticed that he had gone without. The one who watches noticed him noticing. That is the first entry.\nIf you keep a scoreboard of your own, try one week without opening it, and simply note the day you realise you have gone without. He did not feel transformed by that week. He noticed, and noticing was the first entry. In the companion app, Step back asks what you are checking for, so you can record the reach without obeying it."], ["2. Thank You All", "On 21 September 2014 he recorded a prayer into his phone. It runs a little under two minutes, and it opens with thanks for his life at forty-one years of age.\nThen the list. Thanks for his beautiful child, Athena. Thanks for Jenna, whom he called understanding, supportive, encouraging and great. Thanks for his parents, his sister and his brother, for the gifts and the lessons. Then, almost in passing, \u201cI appreciate myself.\u201d\nThe rest of the recording is instructions. He exercises daily. He maps out his day. He visualises and prays daily. He makes his day top heavy, starting heavy every single day and jamming in as much as he possibly can. He always treats his queen as royalty. He always provides his family with everything they need. He is secure, secure enough in all cases.\nThen something quieter, said twice over, as if he needed to hear it land. His weight is not a financial blanket. His thoughts on money do not equal food. He does not feel the need for money with food, and when he says feel, he means feel. Food is a fuel. Money is a means of acquiring needs and wants.\nHe signed off the way no spreadsheet ever did. \u201cI love you, John.\u201d And today is today.\nA year later there is another recording, a minute long. Thanks for keeping him on track with this journey. He visualises on a daily basis. I am the voice. I will lead, not follow. I will believe, not doubt. I will create, not destroy. My time is more valuable than money, it is life, and he does not spend it on anything that does not count.\nThe one who watches listens to both and hears two things at once. The gratitude is real. A man who could open each day thanking his life, his child and his wife was not empty. But the gratitude was also doing a job. It sat at the top of a daily routine built to start heavy and stay heavy, and it was followed straight away by orders: be secure, provide, lead, do not doubt. Even the thanks had a schedule.\nIt notices too that in 2014 he already knew about the food. He had joined his weight and his money in a single sentence and told himself to keep them apart. He knew the link before he could feel it. Eleven years would pass before a guide gave it a name, and before he understood that saying it was not the same as stopping it.\nAnd it notices the line in the middle. I appreciate myself. Spoken quickly, between thanks for his family and a reminder to listen to other people. It was the craving to be appreciated, the one without a column in the I AM HERE files, and for once he had tried to fill it from the inside.\nHe does not need to throw the prayers away. The thanks still hold. What he is learning is to say them without the instructions attached, to thank his life without having to earn it by lunchtime. The one who watches would like to hear that recording one day. Thank you for this life. Today is today. Nothing after it.\nA reader can try his gratitude without the orders: name three things you are thankful for, and stop before the word should. What he noticed was how quickly the thanks wanted a schedule attached; seeing that is the result, not a failure. The Today screen in the companion app has room for exactly that, three lines and nothing after them."], ["3. The Bottom of the Well", "In January 2016 he sat with a worksheet that asked him to go seven levels deep on one question: what is important to you about achieving the ideal you?\nHe started where he always started. Real estate. So his children and theirs would not live a lifetime of toil. Down it went, one level at a time.\nAt the seventh level, underneath the investing and the providing and the generational wealth, was one line. To achieve a close, tight-knit family.\nNot the number. Not proof that the basketball court had been wrong about him.\nThe one who watches sits with the distance between that line and the way the engine actually ran. The engine ran on the wound: Beach Ball, the boy in the pullover, the name a schoolyard gave him. The well ran on love, on Jenna, on Athena and Anastasia. They were never the same engine, and he never stopped long enough to check.\nSo there is a question he has to be able to look at. How much of what he built was pointed at them, and how much of the cost did they pay while he built it?\nHe is not ready to answer it fully. He can write it down where he can see it. That is the first thing the observer does. Not fix, not judge, not react. See.\nYou can run the same seven levels on yourself: ask what is important to you about what you are chasing, then ask it of each answer, seven times. He found a close, tight-knit family at the bottom, and the distance between that line and his daily engine became visible. The Seven Levels practice in the companion app walks one question down, a level at a time, and saves the last line to Road."], ["4. The Seventh Seven", "In May 2017 he sat with Victor and heard his year described as a four: four walls, work, work, work, nothing arriving easily, everything needing more effort than it should. It was the same struggle he had named at the start of that session, steering the ship back to property every time an opportunity in China or a new business pulled him off course. He did not argue with the reading. He answered it. \u201cI\u2019m always moving ahead,\u201d he said. \u201cI always move ahead.\u201d\nThe one who watches hears that line differently now. It was not a reply to the stars. It was the creed of a boy who had learnt that nothing would be handed to him, and it had been true for so long that a year of effort sounded like any other year. He was not frightened by the idea that things would not come easily. He was frightened of the day they might, and he would have nothing left to push against.\nIn August he went back, exhausted. He had spent months rebuilding the house, flying to Queensland on Fridays and back on Mondays while Jenna held the girls together. He said he felt down and out, and not physically right. That day he heard about seven-year phases: that from forty-two to forty-nine a man stands back from life, questions its purpose, grows less interested in the material world, and finds himself wanting time alone to reflect. Standing back and observing, it was called.\nHe did not need convincing. He told Victor he had dropped four or five people in the past year, quietly, without a fight, because he could see no purpose in the friendship any more. He said he was questioning everything at once: his friendships, his marriage, his children, his mother and father, his diet, whether the tiredness was the work or his body. And he said something the one who watches has to smile at. In the last few months, he said, he had stopped caring what people thought of him. He had dealt with it. It was done.\nIt was not done. The book is still full of it. But the one who watches does not mock him for saying it. A man at forty-four, worn out from building, caught a glimpse of a freedom he would spend the next nine years walking towards, and he mistook the glimpse for the arrival.\nWhat stayed with him from that afternoon was a distinction he wrote into himself more deeply than any planet. Letting go does not mean throwing things out. It means not being attached to them. You can let go and still be you.\nThen the talk turned to Athena and Anastasia, to what their numbers said about loneliness and independence and pain they would one day feel. He asked the only question a father could ask. Knowing this, what can I do? And he answered it himself before the session closed. It is not my role to over protect them, he said. It is my role to be observant. Then, quieter: it saddens me to think she will be hurt.\nThe one who watches does not keep the readings. It keeps the man in the chair. In the same months he admitted that four-year-old Athena had tested him until he smacked her, and she looked up and told him he could not do that. He had no override for that look. He was being shown, by the smallest person in his house, that control was not the job.\nStanding back and observing. In 2017 he heard it as a phase he would pass through. The one who watches is what he found when he stopped passing through.\nHis distinction is usable by anyone: pick one thing you are holding tightly and ask whether you need to throw it out, or only stop being attached to it. He did not let go of everything that year, but he dropped a few attachments quietly and saw that he was still himself. The companion app's Step back has a prompt for this one: what can I keep, without gripping it?"], ["5. Little Johnny, John and JJ", "In September 2017 he wrote himself a letter with three names in it. Little Johnny. John. JJ.\nLittle Johnny, he wrote, protects him from bullies and gives him certainty when times are desperate. JJ is the one in control, the one who built Synergy, the one who married Jenna. When Little Johnny is down and out, JJ is to change his state, take control and carry him on.\nThe last line told Little Johnny exactly where he could go.\nThat was how he ran: the frightened boy was the problem, and the answer was to override him. Fire for the fear, and more fire for the fire.\nReading it nine years later, the one who watches can see what the writer could not. The order to shut the boy up was the boy\u2019s own strategy, the habit of the kid picked last who learnt to push down what he felt so he could keep moving. It was the wound, borrowing JJ\u2019s voice, and it had been running so long it passed for personality.\nIn November 2025 the nine-year-old went onto a canvas. It did not silence him. It let him have the wall.\nHe has not fully made that shift. He still reaches for the override. The canvas is where he practises not reaching.\nTwo years before the letter, he had already tried to make peace with the boy another way. On 11 June 2015 he wrote a page titled I allowed that! so I can become this! He listed what the schoolyard had done to him, Beach Ball among it, and wrote that he had no other way out, that he hated school and was different, or at least was made to feel different. He wrote that he never asked for help and that his dad was never present in his youthful life. Then he turned it round: \u201cI became this so I allowed that.\u201d At the bottom of the page he wrote one word, breakthrough, and thanked Mr Green.\nThe one who watches does not grade that page. It was a man making the wound useful, which was the only thing he knew how to do with it then. It notices that even the peace was a transaction: the pain was allowed because of what it bought.\nAnd the one who watches has seen something further. Little Johnny is not only the wound. He is also the engine. The boy who decided he would own the court is the same force that built Manufactor. The question was never whether to silence him. It was whether he could make something without first being made afraid.\nIf you have a frightened younger self you have been ordering about, write him a short letter that does not tell him where to go. He found the override still came, but it came a little slower once the boy had a place on the wall. The Journal in the companion app has a letter template for this, kept private."], ["6. Soldiers and the Truck", "By May 2019 he had been waiting for a date. He had been told the twenty-first of February would begin a new cycle, and through the whole of 2018 he held on to it. That year he did twenty-one transactions, against four in each of the two years before. Two liquidations, one of them in Queensland. He carried the weight of them and came out the other side. A lot of it, he admitted, was spinning the wheels.\nOn the twenty-first of February he went to an auction and a property he wanted gone sold. He took it as proof. The one who watches sees something simpler. A tired man had given himself permission to stop, and he needed a date from outside himself before he would accept it.\nWhat he described that day was not a strategy but a sense. He said it was like standing at the edge of a road, hearing a truck he could not see, and deciding not to cross. He was selling down. He wanted to be cash ready. He called his dollars his soldiers, and pictured himself as a medieval commander building an army, waiting to march on the cities that were vulnerable. Then, almost in passing, he said he was uncertain and that the uncertainty did not bother him. It was a positive thing, he said, to be uncertain.\nThe one who watches holds both of those images side by side. The soldiers are the old engine: money as an army, the world as cities to take. The truck is something newer. It is a man trusting what he feels before he can prove it, and finding that not knowing does not kill him. He would not have the words for it for years. Linda would one day tell him control had never been there. In 2019 he was already standing at the kerb, listening.\nHe also said he was asking himself how much more money he needed to keep making. He wanted to enjoy his life. He was taking Jenna and the girls overseas for two months, to Greece and Cyprus, and he said it felt like connecting with the past.\nThen he said something harder, and the one who watches will not leave it out. He told Victor he divorced his wife in his head at least once a day. If she did not do what he wanted, it took nothing. In the same breath he said they had a good marriage, that in seven years they had argued once or twice, that she was peaceful and never thought that way at all. He had picked one word out of everything he had heard that day and kept it: ruthless. He said it fitted him, even with people less fortunate than himself.\nHe described two separate lives. He brought in the money; Jenna ran the house and the girls. He said she always carried tension in her shoulders and that he was always massaging them. She had grown up in a family where speaking up was not encouraged, and when someone pushed her she agreed, then wished afterwards that she had said what she really thought.\nThe one who watches reads that page now and sees two people who learnt the same lesson in different houses. She learnt to keep the peace by swallowing her words. He learnt to keep himself safe by making his decisions alone and fast; all his good decisions, he said, were quick ones. Neither had been taught to say, out loud, what they felt and wait to be met.\nHe did not see that in 2019. He saw a quiet wife and a restless husband and a marriage that worked. What he could see was that the soldiers were tired, and he could hear the truck. That was enough to stop him crossing.\nA reader can borrow the kerbside moment: when you sense a truck you cannot see, write one line about what you feel before you look for proof. He did not get certainty from it; he found that uncertainty did not kill him. Pause in the companion app gives you a slow breath at the kerb before you decide whether to cross."], ["7. Background, Not Foreground", "In June 2026 he began twelve Thursday sessions with Jay. He walked into the first with four things on the table: the ringing was louder and colouring his mood, he was stuck in a Groundhog Day of good days and bad days, the business was growing in spite of the stress, and a legal fight was still running.\nThree problems and one piece of progress, and the one who watches could feel his attention handing the problems almost all of it. Noticing that was the first lesson. Not changing it. Noticing.\nOver the next weeks he came to see that he counts. He wakes and checks the ear. He tracks the days. He grades each one. Every count drags the noise back to the front of the room.\nHe has worn glasses since his twenties and never thinks about them. They are on his face and not in his attention. It dawned on him that the ringing could go the same way. Not cured. Moved from the front of the room to the back.\nSo he built a small practice. On waking, he notices the reach to check the ear, lets it go, and writes down three or four things that are plainly true right now, without grading them.\nThe counting is still faster than the letting go. The reach happens before he is fully awake. But the gap between reaching and letting go is getting shorter. That is the one per cent, and he has learnt to count that instead. The one who watches has learnt to count it with him.\nTry his waking practice for a week: notice the reach to check whatever you check, let it go, and write three or four things that are plainly true right now, without grading them. Expect the reach to stay faster than the letting go at first; what he noticed was the gap shortening. The companion app's Today screen opens with exactly this prompt, three true things, no scores."], ["8. Data and the Dragon", "The tinnitus arrived in March 2025, eight months after his father died. For months he treated it the way he treats most things: a problem to solve, manage, beat.\nSomething concrete happens. The ear spikes, the cash flow moves, someone at work does not deliver. Those are facts. The moment he labels the fact unacceptable, catastrophic, proof that it is all falling apart, he has left the fact behind. He is in what he has come to call the dragon state: the body floods, the old survival wiring takes over, and a mind built to spot lions makes dragons out of a bank balance and a sound.\nOne morning he heard himself say that even his ear noise was a construct, that it did not really exist. The one who watches knew what he meant before he did. The sound is real. The suffering, the meaning stitched onto the sound, was something he was building. The sound is data. The dragon is the story he writes about the data.\nIn the first book he wrote that the ringing was fear dressed as sound. It was the truest thing he could say then. Now it reads more precisely: the ringing is data, the fear is the story, and the story is the part he gets to choose.\nThe dragon is not his enemy. It kept a nine-year-old moving through the industrial streets at dawn. But he is fifty-three and nobody is chasing him. Most mornings he forgets that before breakfast. More mornings than before, the one who watches reminds him.\nHe had described the dragon before he had a name for it. On 6 October 2015, sitting at the kitchen table, he wrote a page called Anxiety and noted that it had taken him a week to write about the subject. Anxiety, he wrote, makes us operate on a higher vibration than normal: he shook his foot, he picked his nails, and most of all he reacted to every thought he had. Then he wrote the line that reads now like an early draft of this chapter: depression and greatness are the negative and positive of the very same analysed thought.\nSeven months later, on 13 May 2016, he went further. Meaning, he wrote, is what you give it, and once given it may have no effect on what is actually true. He closed the page with a sentence and a signature: \u201cThis is happening through me not at me.\u201d The one who watches finds that sentence nine years before the ear and leaves it here as evidence that the seeing was always in him. It simply had not yet been given the chair.\nWhen something spikes, write the fact in one line and the story in the next. He found the sound stayed real while the story became something he could choose. Step back in the companion app splits the page for you: data on the left, dragon on the right."], ["9. Director, Not Critic", "For most of his life he watched his own life the way a critic watches a film: wait for the end, then grade it. The deal closed, a good year. The tenant left, a bad one. Always the back row, always a scorecard, always late.\nIn a session in 2026 he described something he had not noticed was happening. The movie used to just be manufactured. In the last year he had begun to see every scene being played out, directed, redone and changed. As he said it, the one who watches recognised the whole of the shift.\nA director is on set, inside the scene while it is made. He asks different questions. What is this scene doing? What is being learnt? What is the next right thing? None of them carries a score.\nHe saw that he had spent thirty years chasing success, which is a verdict, when what he loved was succeeding, which is a verb. Success arrives late and expires fast. Succeeding is in the scene, available every morning, including the bad ones.\nThe director frame did not settle everything. By August he would see that the director had been building the darkness on purpose to get the scenes made. That belongs later. In June the change was smaller and more useful: he had moved seats.\nThe one who watches is not a critic either. The critic needs the ending. The observer only needs to be present for the scene.\nIn the middle of an ordinary day, ask the director's three questions: what is this scene doing, what is being learnt, what is the next right thing. He did not stop grading overnight; he moved seats, and the questions carried no score. The Today screen in the companion app offers them when you mark a scene."], ["10. The Brewery and the Forge", "In June 2026 a session that began as a design briefing for the brewery precinct finished as a session about the dragon state. That is most of his days at the moment. The building and the inner work are not separate jobs.\nThe brewery is called Castlereagh. He knows what he wants it to feel like: communal industrial tables, a copper pizza oven inspired by the Imperial, dark tones and warm leather, a layout that makes people talk to each other. He has a word for that warmth and permanence: Hobjan. A place that is winter-proof and does well when others struggle.\nThat is the forge. The irons in the fire. The maker making. He is good at it.\nThe one who watches marked the moment the conversation moved from design to staffing. The dragon arrived on cue. New people on a hundred and thirty thousand dollars who needed constant checking. The old job of being the invisible quality-control layer, absorbing every gap with his own time. It watched the change move through his body mid-sentence, and for once he saw both conversations running at once. The one who watches saw him seeing it.\nIn June he believed the brewery was a beautiful problem, exactly the kind he was built for. That belief is left here as it was.\nBy the end of August he had said aloud, for the first time, that he is not a beer guy and never was. The brewery was where the old method stopped working: building something under pressure that he had no love for. It was also where the ear had been loudest. He owned a brewery and had spent a year treating the yeast as the problem without once looking at the brewing method.\nA reader can notice the moment a conversation moves from what you love to what you fear, and mark it mid-sentence. He saw both conversations running at once, which was more than he had seen before. Step back in the companion app has a two-column note for the moment you catch it."], ["11. Errol", "He sat with Errol Jacobson most Mondays through the second half of 2025. He would leave on a Monday feeling like Superman, and by the weekend the noise would be back and he would have forgotten the hard part: the work does not happen in the room, it happens in the week.\nThe first thing he saw was how much he was learning about his mind instead of living in it. Self-help in every spare minute, until one day he asked what all this work was for. He had turned healing into another job.\nThen there was a Sunday. He sat around the house and felt guilty for sitting around, then guilty for feeling guilty. Followed back, it went to a boy cleaning factories after school until seven at night, and a rule written in that boy: I am safe if I work. Rest had never been neutral for him. Rest was exposure.\nFood too. By March 2025, around the time the ringing arrived, he had brought his weight down to ninety-nine kilos. Food had been one of his oldest ways of soothing himself, and he had taken it away. The one who watches can see that some of what rose that year was simply feeling with nowhere left to hide.\nHe learnt the difference between the part of the brain that reasons and the older part that reacts. Flooded, he had been asking the reacting part to analyse. So he wrote the thought down and read it twenty minutes later. Nearly every time, it had been written by the alarm.\nThen the word over-responsible: at home, in business, with family, with tenants. He looked it up and found arrested development. He thought it was a band. It describes a child made into a parent too early, and he recognised the boy who had looked after everybody.\nThe hardest thing was that he had lost trust in himself through the business years, and that losing it was tied to finally letting go of perfection. He had always believed he inspired people. With Errol he wondered whether he had really been trying to inspire himself, and whether what he craved from outside could only come from within. Worth cannot be acquired. He could own half of Australia and still not have it. This was the first place the one who watches understood that the guides were not helping him build more. They were helping him find balance.\nThe simplest piece here is yours to use: when you are flooded, write the thought down and read it again twenty minutes later. He found that nearly every time it had been written by the alarm. Pause in the companion app will hold the note and remind you in twenty minutes."], ["12. Jodie and Paula: Feeling Without Fixing", "Jodie Lowinger and Paula met him in the worst of it, in May and June 2025, when the noise was in front of everything and he was treating his anxiety like a business problem to be closed out by the end of the quarter.\nHe began to do something very simple. When a worry arrived, he stopped and asked whether it was real. He could be sitting safe in a room, eating, talking with someone who meant no harm, and his body would be braced for an attack that lived entirely in the future. No threat. So why the fear? Asked over and over for a couple of weeks, that question did more than any protocol he had bought.\nThe one who watches noticed how uncomfortable he was spending money on himself. The flinch was still there every time. The same scarcity, in a nicer jacket.\nThe image that stayed was a radio in another room. Some days louder, some quieter, playing in the background while he got on with his life. Acceptance took him out of the boxing ring with the sound. Fighting it had kept it on stage.\nHe learnt that every time he talked about the ringing to people with no reason to carry it, he gave it strength. So he stopped. Not denial. Just no audience.\nHe saw what the anxiety did to who he thought he was. All his life he had been sharp, never forgetting a thing. When he walked to the fridge for the girls\u2019 drink bottles and forgot why, he questioned everything. That was the perfectionist talking, not the ear.\nAnd he already knew something from business: issues never last. Time moves everything off the stage eventually. He did not need to drag it off. He needed to stop holding the spotlight on it.\nThe first night he slept with nothing in his ears, nothing had been fixed. He had simply stopped guarding the door.\nWhen a worry arrives, stop and ask whether it is real, here, now. Asked over a couple of weeks, the question did more for him than any protocol, though nothing was fixed. The Step back prompt in the companion app begins with that question: is this real, right now?"], ["13. A Hundred Miles an Hour", "On 26 May 2025 he sat down with Linda Wallace for the first time and found that he already had the picture. He had been driving at a hundred miles an hour for most of his life, building himself up financially, and the car had crashed. He was not on the road any more. He was in the air, spinning, waiting to see how he would land.\nHe had never used that image before. It arrived whole, and he knew it was the truth.\nHe could see what the driving had cost. He did not get to enjoy any of his life. He still lived as though he were starting from nothing. He had read Anthony Robbins and Brian Tracy young, planned his life and raced it, and somewhere along the way he had stopped checking whether the direction was one he wanted. What he did at twenty-nine he did at thirty-nine, and what he did at thirty-nine he did at forty-nine. He had traded most of the buildings he had built. Now, at the halfway mark, he did not have to do any of it again. So what was it for?\nOn 12 June 2025 he recorded a short call with Peter Quintiliani because he wanted to keep what had been said. He had been growing and growing. Now there was the possibility of becoming comfortable with what he had, maintaining it and enjoying it. Not a promise never to grow again. A permission not to make growth the price of every day. The one who watches hears how unfamiliar that was. He had learnt to recognise progress by what had been added. Enjoying what was already there did not add a building or improve a number. It asked whether he could inhabit the life the speed had bought, without treating the pause as the beginning of losing it.\nHe said the rest plainly. It is lonely at the top. He owns the company and answers to no one. He is in a car by himself, a driver driving, and the friendships he does have tend to be with people who need his help, until the advice has been given fifty times and the friendship has turned into somewhere to talk. He wanted to spend more time with people for who they are, not only for what gets done.\nHe named his thoughts as the thing that had got him there. He wakes with twenty or thirty seconds of negative thinking, as far back as he can remember, and then he pushes, positive and pushing for the rest of the day. He had begun to notice that pushing is very tiring. Something else might need to come towards him instead.\nAnd near the end, almost in passing, he said it. Maybe he needed to be an artist. He loved drawing. He had always drawn. He had trained in architectural drafting, could never work for anyone else, and had gone into buildings because that was where the drawing could earn. He felt something move as he said it, even then.\nThe one who watches marks this as the first entry of that year. The man in the air did not yet know where he would land. He knew only that the speed had been the problem and not the solution, and that the ear was knocking like a barometer, bang, bang, bang, telling him so. Every later chapter of 2025 starts here, with a car off the road and a man who, for once, was not steering.\nIf your own life has been driven at speed, try naming one thing you already have and spend ten minutes enjoying it without improving it. He found the pause felt unfamiliar, and that it did not begin the losing he feared. The Road view in the companion app keeps a short list of what is already there."], ["14. Am I Becoming My Father?", "On 25 June 2025 he brought a notebook full of his father to a session with Jodie Lowinger. He had written a great deal down. He wanted to know where his father sat in his life, and where he sat in his body.\nHis father had died on 1 August 2024, at ninety-five. Eight months later the virus came, and the ringing with it. He had already said he did not mourn him. That day he began to see what an unmourned loss does. It goes under the surface and stays there, and a man who wants to be everything to everyone pushes it further down, until the pressure has nowhere to go but out through the body.\nSo he described his father. A placid man. Peaceful, never a fight with anyone, holding his ground without raising his voice. He had travelled the world when he was young and worked on cruise ships. He was never one for hugging his children, and never seemed to be there for them. His mother carried the ambition in that house. For as long as he could remember, he had said that his father taught him the kind of person he wanted to be and the kind of father he did not want to be.\nHe had built himself as the opposite. Go, go, go, a hundred miles an hour. The youngest of three, always proving himself, the one who was there every weekend for the six years it took to renovate the family home, the one who took on the responsibility to provide. The protector. The father figure, even to his own brother and sister.\nThen he told her something he had carried for years. Many years ago his father had said to him: I was just like you once. He had dismissed it on the spot. There was no way. His father could sit on the couch all day and sleep.\nThe one who watches noticed the pause after he said it. He had refused the sentence because he did not want to align with the man. And then, with the ringing in his ear and the feeling that there was nothing he could do about it, the question he had never let himself ask came out of him. Am I becoming my father?\nHe did not know what had shifted in his father, or when. That was the part that scared him.\nThe same session held the other half of it. He had already done an exercise on wanting to be a free spirit. What would he do, if he were a free spirit for a day? He wrote his answer down. He would chill out. Reflect. Work out a new path. Calm and ground himself. Enjoy his family. Do nothing, and be okay with doing nothing, without guilt and without seeking reassurance that he ought to be off doing something.\nReading it back, he saw that even sitting on the couch on a Sunday had been a massive no-no. His life had been go, go, go, next, next, next, push, push, push, and he was forever giving reasons for why he was doing whatever he was doing.\nThe one who watches sets the two pages side by side and does not resolve them. The man on the couch he swore never to become, and the free spirit for a day he wished he could be, are sitting in almost the same place. One is the fear. The other is the longing. He has not decided yet which one he is looking at when he pictures himself at rest.\nWrite your own answer to his exercise: if you were a free spirit for a day, what would you do? He noticed the answer sat close to the thing he feared, and seeing both on one page was the result. The Journal in the companion app has this as a prompt, with space for the fear beside it."], ["15. Linda, Chris and the Body", "By the middle of 2025 he could explain his anxiety better than most people can explain theirs. His body had not read any of it.\nAcross those months with Linda Wallace, from May to September, the idea of the observer came up early and it stuck. He wanted to be an infant again: calm, grounded, simply watching what came in. Of the questions he had collected along the way, the last was the one he needed most. If he cannot control what is about to happen, he can get okay with it. What else is there to do?\nHe came to see that his sense of safety had been tied to control and certainty his whole life. He had built an external facade for security. The work was to be with uncertainty from the inside, so that feeling safe no longer depended on being in charge. That is what internal balance means here, and it is the opposite of what fifty years of building had trained him to want.\nHe started to say thank you. On his Excel sheet, of all places, he wrote thanks for fifty-two and a half years of perfect hearing in his left ear. It was very hard to write. It turned the ledger from what he had lost to what he had been given. The one who watches notes the irony that the first honest thing he wrote in a spreadsheet was not a number.\nAt the end of that work were three reflection questions, all asking the same thing: what did he gain, what did he learn, what is he taking away. He is still answering them. This book is part of the answer.\nChris took him into breathwork, ninety-four minutes on a floor. Beforehand he admitted something he rarely says: people see him as strong, a bit of a caveman, but he is very vulnerable to his own judgement of himself. Then he breathed, and his mind offered every excuse to stop: the toilet, hunger, irritation. He learnt that these were the self-preservation reflexes trying to keep him where he was, and that the release lay on the other side of them. He had been a pressure cooker for decades, and every coping mechanism had been a lid, not a valve.\nWith Dr Kate, in June 2025, he said aloud something he had not faced. His father had died at ninety-five and he had not grieved him. Just before the ringing began, a family exchange about Dad\u2019s rings had ended in words from his brother that no one should send. Weeks before that, his journal said he was tired of listening to people. He began to see the ear as a barometer of everything he was carrying. The body had been keeping the account even when he was not.\nWrite one thank-you for something you have lost or are losing, and then answer his three questions: what did I gain, what did I learn, what am I taking away. He found the first line very hard to write, and that it turned the ledger round. The companion app's Journal keeps the three questions together so you can come back to them."], ["16. Daniel: What the Hardware Is Doing", "Daniel Fetchner spent three and a half hours with him in 2025, the best appointment in a year of appointments. By then he had seen something like two dozen specialists, from the heart to neurology.\nIn the first book what he took from Daniel was that fear is the absence of knowledge. What came after was quieter. Hearing and the emotional brain are wired together far more tightly than he had imagined. A change in the ear does not stay in the ear. It can unsettle a person completely, and none of that means something is broken.\nHe was asked what percentage of his waking time he was aware of the ringing. He had never measured it that way, only by how bad it was, never by how often he noticed. The one who watches registered the shift at once: from volume to attention. Attention was the thing he could work with.\nHe wore the hearing aid every day for a while. At his daughter\u2019s event he found it extremely annoying. He wanted to move forward without it, and in time he did. The device was support while he relearnt, not a cure to depend on.\nSomething else surfaced that had nothing to do with hearing. When the matter with his brother resolved, he saw it had been about boundaries all along, and about the meaning he chose to give his brother\u2019s words.\nThe fear underneath it was older than the rings. On 23 August 2015, his brother\u2019s birthday, he wrote a page on love and fear and set down the plainest sentence in the diaries: he feared finding out that his brother did not love him or want to love him. Fear, he wrote on the same page, is not knowing whether there is love there. The one who watches sets that beside the words that came a decade later and does not draw a verdict. It notes only that the boundary was being drawn around a very old fear.\nHe said one thing in those sessions that the one who watches keeps returning to. The ringing woke him up. His body said, listen to me, and if you do not, you will listen to me anyway. He had done everything there was to do and learnt where he stood. After that, it was his turn to change.\nInstead of rating how bad something is, estimate how much of today you noticed it. He found attention was something he could work with in a way volume never was. Today in the companion app asks for a percentage, not a severity score."], ["17. The Cylinder and the Sunflower", "On 1 September 2025 he was asked to draw the shape of his life before.\nHe drew a cylinder. It had no end. The routine was the same every day, in every day and out every day, almost prescribed. Beside it he wrote the words that belonged to it: just go on.\nThen he looked at what he had drawn and laughed, because it looked like something he would not say in polite company, and he said it anyway. The joke turned out to be accurate. It was protection. Put the blinkers on, do not let yourself feel, do not worry about whatever happened, keep going. It had kept him safe and it had also been suffocating. Underneath the blinkers he found a sentence he wrote down straight away: the fear to realise. The fear of realising that there was life outside the cylinder, and that this was not what reality was.\nHe could trace it back. In years seven to twelve a teacher, Mr Green, gave him a key to the technical drawing room, and he spent recess and lunch there, mostly alone. He saw it now as his way of staying unseen. At home he did not ask for clothes, because his parents could not afford them and he did not want to put pressure on them. He wore his brother\u2019s shirts stretched over him and a school jumper in summer. Under the family home, during the six years of renovation he had already described to Jodie, he stapled the central heating to the floor by himself, and when he asked himself why, the answer was recognition: if they were happy, he would be safe. When he was a boy sweeping factories he saved up nine hundred dollars, and they took it. Not being seen, he realised, was the other face of wanting to be seen.\nThe better shape came to him as a sunflower. He was at the centre of it, with agency, and around him were the parts of a life held in balance: love, the spiritual, the financial, the physical, the emotional, and feelings with a petal of their own. One was a prisoner, he said. The other was a free spirit, growing in the sun. He had been sitting in the sun that very afternoon.\nThen he was asked what the John of 2005 wanted him to remember, the John who had come through testicular cancer and walked out of that year with enormous agency. He wrote: remember my future and forget the past. It explained why he had been so future focused ever since. He could see the cycles now. Spiritual until about thirty-two, when he had thought of becoming a monk and stayed for his mother. Financial from thirty-two to fifty-two. And now, he felt, the physical and the emotional.\nHe also saw the cost of the financial cycle. By March 2025 he had reached every goal he had set for the age of fifty. He had not celebrated a single one. He had properties, cars, children, everything, and it was empty. A week earlier he had put it more bluntly still. Full on everywhere else, he was no different from a homeless person who is empty, because emptiness in any one human need is still emptiness.\nThe one who watches can see the sunflower he would come back to all that month, the one that interrupts the go-on part and says look at me. The sunflower did not replace the cylinder by force. It grew where the blinkers came off. He knew, too, that a drawing of a sunflower is still theory. Until he lives it, physically, he said, it is only a picture. The work was to become it.\nDraw the shape of your life as it is, and then the shape you would like, without making either neat. He found the drawing named things he had not said, and that a drawing is still only a picture until it is lived. The Practices tab in the companion app has a blank page for both shapes."], ["18. The Wizard Pulls", "A week later, on 8 September 2025, he came back with the Wizard of Oz.\nThe yellow brick road had first inspired him years before, and back then it was about business. Now he saw it as the road of internal worth. The Emerald City was all external, shining, the thing you get drawn to. The values he had chosen to walk with were growth, wisdom and vision, and none of them could be seen from outside. You cannot shine wisdom off yourself. It grows inside.\nHe was not comfortable with the line about the journey mattering more than the destination. If it was never about the goal, why do the journey at all? The only answer he could find was that he would have to become one with uncertainty. Nobody knows. All there is, is the road.\nThen the picture turned around. There was the wizard, the John of 2045. There was the John sitting in the session. And there was the five-year-old whose photograph he looks at every day. All his life he had pushed his way to wherever he was going. Now he saw that the wizard could pull him there instead, and that it is easier to pull than to push. That was why wisdom was one of his three values: to be the wizard, open enough and attuned enough to let himself be called.\nIt linked to the sunflower without his trying. The sunflower turns to the sun because the sun draws it. The plants outside his house all grow towards the north for the same reason. It is a natural attraction, and it is effortless. The word landed on him: effortless. For a man who had pushed everything, it was a new way to move.\nUnder all three values sat one word he kept returning to, the same one he had been circling with Errol. Inspiration. He knew he inspired people. He realised that he had been craving to be inspired himself, and that he had been looking for it in the outside world, where another Rolls-Royce or another purchase only lasts as long as the last one. Inspiration, he saw, has to be felt within. He decided to go looking for it more consciously, cherry-picking what moved him in people and places rather than waiting for one perfect role model who may never exist.\nHe also caught the perfectionist at work, the same one who had made him question everything when he forgot why he had walked to the fridge. He had left his card upstairs and beaten himself up for it, while everyone around him forgot things all day long and simply laughed. Perfect him measured everything: how he presented, how he looked, how he spoke, how he dressed. Perfection brought control, and control was an attempt to forecast and manipulate the future. He saw that demanding perfection of everyone around him was a guaranteed failure.\nAnd he saw the parentified boy in his over-responsibility. Over-responsible adults attract under-responsible people. He had been learning to say no. His younger daughter had taught him that, after a bedtime argument in which he had said yes when her mother had said no. He told his staff to sort things out, and to come to him only if they could not. He was learning to let them grow.\nHe named one more thing that week, the hardest of them, and it belongs to the end of this book: he could not let praise in. The one who watches holds it beside the wizard for now. Being pulled is only receiving, at the speed of a sunflower, and receiving was the thing he found hardest of all.\nChoose the one value you want to be pulled by, and ask once a day what would pull you towards it now, rather than what you must push. He did not become effortless; he noticed that pulling was easier than pushing when he let it be. Road in the companion app holds your chosen values at the top."], ["19. The Way He Would Speak to a Child", "On 8 September 2025 he told Errol Jacobson that he had sat with his pain that morning, and that he was asking himself questions in his limbic mind. He did not want answers, he said. He just wanted to feel it.\nIt was a new way of asking. The old way was a cross-examination. Why am I hungry when I am not hungry? Why am I picking my fingers? Why this, why that? He had been putting questions to the frightened part of himself the way he would put them to a supplier who had missed a deadline, and demanding a reply by the end of the day.\nThat morning he saw it from the outside. Demanding answers of a feeling is a way of telling it not to dare exist until it can explain itself. He would never do that to a child. No one would sit a frightened six-year-old down and insist on the reason before they were allowed to be upset.\nHe came away with a word for the alternative: self-parenting. Treating himself the way he would treat a child. Gentle, fair and firm. Eating properly, sleeping properly, exercising, doing the work that has to be done whether he is motivated or not. Letting himself share what he feels. Letting himself be himself. Basic, primal things, and a great many adults skip them. When they are skipped, the message that reaches the old part of the brain is that it deserves neglect. A child who is neglected learns that it is not worth much. The same lesson can be taught from the inside.\nThe same session turned up something he had not looked at before. He had noticed that the people around him tended to be people who needed growth. He did not have anyone who really helped him grow. He began to see that it was not bad luck. He was drawn to people with broken wings, because if he could help them he felt acceptable. Being the helper was where he felt safe. And beside it was a wall of words, the wordsmithing that meant no one quite got to see him.\nWhat it cost him was a piece of information his own nervous system had never been given. He could not help anyone and still be acceptable. He could stop talking and still be acceptable. The helping and the words had always arrived first, so the old brain had never once seen what happened without them.\nOn 15 September 2025, with Errol, he said what he wanted for the girls: \u201cI want them to experience love, not just telling them I love them.\u201d He knew the difference. A result could be discussed, an effort encouraged, without making love wait at the end of either. The one who watches hears a father trying to separate two things that had been joined in him for years: doing well, and being worth staying with. What he wanted to give his daughters was also what he was learning to give himself.\nIn the same session he found himself thinking about two fathers and one box of Lego. One father works so hard for his children that he is hardly ever home, and buys the Lego. The other has little money and plenty of time, and sits down on the floor to build it with his boy. The first child learns that there is stuff but no investment of time, and wonders whether he is good enough. The second learns that he is worth something, not because of the Lego, but because his dad wanted to hang out with him.\nThe one who watches did not need to point at the first father. He saw himself in both of them: the boy who learnt his worth had to be earned, and the man who had spent a life making sure everyone around him was provided for.\nSo he has a new instruction for the frightened one, and it is not to explain itself. Sit down. You do not have to help anyone today. You are acceptable anyway.\nWhen a feeling arrives, try speaking to it the way you would to a frightened child: sit down, you do not have to explain yourself. He noticed that the cross-examination softened when he stopped demanding a reply. Pause in the companion app has a short line you can say with the breath."], ["20. The Sunflower", "On 22 September 2025 he sat with Linda Wallace a few days after buying himself some shirts. One of them was the colour of a canola field. The old voice had tried its usual lines: too expensive, it won\u2019t look good on you. Another part of him had overruled it. He loved the shirt. That was him. That was Johnny, the little boy.\nStaying with the feeling instead of explaining it, he found a smile inside, sentimental, rising up into his face. He realised that little Johnny had been a parenting child. He had parented everyone around him. He never allowed himself to be the sunflower he had drawn three weeks earlier, wide open to the world, because he had to feel safe, and the way to feel safe was to make his parents feel safe: not asking them for things, not harassing them, not putting them in a position where they had to provide. If they felt unsafe, he was unsafe. He had gone on parenting ever since. His brother, his mother, the people around him, the partners before Jenna.\nHe told little Johnny that he was sorry it had taken so long, but he was here now. The boy, he felt, had been waiting a long time for him to do this.\nThen a new word arrived, and with it a sadness he had not named before. He was sad for what he had done to himself. He had suppressed his inner spirit to become financially strong, so that he could take the burden off his parents and never create that burden for his own family. He had done it. But there had been a cost. He had taken away little John\u2019s childhood. He could see photographs of himself at two, three, four, five, six, and recognise the boy, but he could not remember being him. Work, work, work and then a little play and then work, work, work, with everything else pushed down to reach the goal, and no time for his inner life to play and have fun.\nThe sadness and the confusion came together, the way they always had for him. And the mind did what it always did. It jumped to the why.\nWhy didn\u2019t he protect Johnny?\nHe heard the answer as soon as he asked it. He could not have known that forty years later he would be asked about what happened when he was eleven. The question had no answer worth having. The why, he saw, becomes irrelevant.\nWhat was left was simpler. Anybody would feel sad. If he watched one of his daughters go through it, or a friend, or a little pup in pain, of course it would be sad. Sadness is the natural response to something sad. He did not need to know why any of it happened. It had happened. It needed to be known and seen by him.\nHe wrote it down before the session ended. Ask why, but let the feelings come first. If he sits with the feeling, the why stops being a big deal. If he does not feel it, he chases the why instead, and the why is a very inaccurate question.\nThe one who watches has seen him chase reasons all his life. This was the first time it watched him let a question go unanswered and feel better for it. The boy did not need an explanation. He needed a man in a canola shirt to turn up.\nUse his own written rule: ask why, but let the feelings come first. He found that when he sat with the feeling, the why stopped being a big deal, and he felt better without an answer. Step back in the companion app asks for the feeling before it lets you type a reason."], ["21. Overuse Injury", "On 8 September 2025 he told Errol Jacobson something he had worked out about a year or two earlier. He used to eat and eat and eat, and the eating covered everything else. Since the weight had come off, and his stomach was no longer held in the way he had held it his whole life, something else had come up.\nErrol gave him a way to see it. Every escape has the same shape. Food, alcohol, gambling, screen time, over-exercise, sleep, avoidance, earning money. A little of any of them is human. Everyone suppresses a little. But use one too much and it leaves an overuse injury.\nIn his case the injury was the weight.\nIt landed hard because he had always thought the weight was the problem. It was not. It was the injury. The problem came before it: he had never learnt to soothe himself, so every feeling went somewhere it could be covered. He had drawn himself a picture of it, with the injury in the middle and all the overuse sitting around it. Underneath the picture was the thing he could finally say. His biggest injury was not allowing his feelings to be felt.\nThere was a second part, and it was less comfortable. Taking the escape away does not fix the original problem. It hands it back. Once the food was no longer doing the covering, the anxiety had nowhere to hide, and it began to come out in his body instead. The anxiety had been there all along. The food had simply stopped hiding it.\nA fortnight later, on 22 September, it came round again. He had stepped back from the groundwork at the business for a couple of months, and the place had run without him. Nothing catastrophic happened. Talking about it, he felt the anxiety rise in the room, and he was asked what it was. Anxiety. That was the whole answer. Where he felt it did not matter. Why he felt it did not matter yet either.\nThat was the instruction for the injury. When the emotion arrives, do not go looking for the cause. A frightened brain cannot analyse, and asking it to only adds more anxiety. Move towards the feeling. Sit in it. If he wants to think about why, he can do it later, once he is back in his adult mind. Until then it is just a feeling to be counted, not a problem to be solved.\nOn 30 September, with Errol, he found another way of naming the escape. He could cover an emotion with thought. The thinking looked responsible, even useful, while keeping him one layer away from what he felt. The one who watches does not take this as an instruction never to think. It notices the order. First the feeling, without making it answer an adult question. Afterwards, the question, if it still needs answering.\nHe had already noticed the change in himself. He had been sitting with his emotions for long enough that they released more easily and more quickly. Sometimes one would not get above a three, and he would recognise it and do nothing at all. Above a three, he would try. He no longer needed the techniques in their careful order. He just knew.\nThe one who watches sees why the word injury is a kind one. An injury is not a character flaw. It is what happens to anything used beyond its limit for too long. The eating was not a failure of will. It was a tool he had reached for since he was young, used every day by a man who had never been shown another.\nWhat heals an overuse injury is rest and balance, not punishment. More feeling than escape. Not perfect. Just more of one than the other, and then a little more.\nName the escape you overuse, and next time the feeling comes, move towards it and give it a number; if it is under a three, you may do nothing at all. He found his feelings released more easily over time, not perfectly. The Practices tab in the companion app includes this as the Overuse check, with the three-point line built in."], ["22. There Was Never Control", "A week later, on 29 September 2025, he went back to Linda Wallace and looked at the oldest arrangement in his life.\nHe traced it out loud. A young kid, the third child, watching his parents struggle. He had to create certainty for himself. There was trust in him and him only. To be kept safe, he had to keep his parents safe, and the way to keep them safe was to stay out of the way of their day-to-day. He became a parent very early.\nIt had worked. For thirty-five of his fifty years he had been in control, full on, and as long as he was in control, everything worked out the way he wanted. As a young man he knew it clearly: if I am in control, we are going to win. It had become proof that everybody around him was good, but unless he did it himself, it would not get done.\nThen came the year of the ear. He had been telling himself that certain people had made him lose control. That day he heard himself correct the sentence. He had not lost control. There was never control in the first place.\nThe one who watches marked the correction as the turn in the session. A man cannot lose what he never had. What he had lost was the belief, and the belief was what had kept him hypervigilant for fifty years, the only trusted person in his own life. The ear, he saw, had been reporting that vigilance. Nearly everyone hears something in a perfectly quiet room. A brain that has to keep watch hears more of it.\nHe was asked to write about how his relationship with uncertainty and control had changed. He started from the end. He does not need to be in control. He does not have a relationship with certainty, because he does not believe in it. If he can control something, he will. If he cannot, it is not his to control, and he leaves it where it is.\nCertainty, he said, is a mirage. Look for uncertainty and it is everywhere. Look for certainty and it is very hard to find. Even death, the one thing everyone calls certain, comes with no date on it. What he had actually been looking for all along was a sense of safety, and he was beginning to find that he could cultivate it regardless of how certain or uncertain things were. Work is uncertain. Life is uncertain. There is a problem, he fixes it, and he enjoys it.\nThen he wrote a list of what he had sacrificed for the future John. He noticed that sacrifice was a dangerous word, and wrote the list anyway. He had sacrificed certainty. He had sacrificed control. He had sacrificed his mistrust of others and of himself, and most of all his judgement of others and himself. He had sacrificed the over-responsibility that had led him nowhere, and the parenting he had chosen, delivered and prescribed to everyone around him, when it was never required.\nAnd what did that give him? Uncertainty, which he found he loved. No need to control. He trusts himself. He judges better. He is responsible for his two daughters until they reach a certain age, and he is a top parent to them. He does not need to parent everyone else.\nIn those sessions the part of him that had missed playfulness, joy and humour seemed to have come back. The one who watches noticed that it came back in the same month the control went. Perhaps it had been waiting for the job of keeping everyone safe to be handed in.\nUncertainty, it turns out, is livable. He had said as much in May 2019, hearing a truck he could not see, and had drawn the opposite in the cylinder a month before. He has been living in it all along. He only just found out.\nWrite a paragraph on how your relationship with control has changed, then a list of what you have given up and what that gave you. He found the list ended with things he loved, which he had not expected. The Journal in the companion app has the two lists side by side."], ["23. Let It Come", "There was one session that was not about talk at all. In a cranial session in 2025, a practitioner worked through his body and reported what was found. The fight-or-flight pattern that used to run busy and overactive around his belly had settled. The back had settled. The old compression around the left temple, which had been stuck before, was fine that day. What wanted attention now was high in the neck, and the instruction was simple and physical: keep doing the chin tucks, watch the posture, lengthen the back of the neck.\nThen came the part he kept. Emotions that have been suppressed for a long time come up when they are ready. The deeper he went with this work, the deeper the material would be, more uncomfortable, more regressed. That was not a sign of going backwards. It was coming up because he was in a good state, because the body was feeling safer, and only a body that feels safe will let the old things through.\nIf something did come, a sadness or grief or anger or rage, he could let it out. It might be crying, or yelling, or a long string of expletives. It might last twenty seconds or two minutes, and he might feel wiped out afterwards. He did not need to look for it, pause it or think about it. He did not need to work out what it was, how many times it had happened or whether it was right. That was irrelevant. It was old, it had nothing to do with now, and it was simply the nervous system finishing what it had not been allowed to finish, probably for good reasons, many times, as a child and since. Find somewhere private, where the children would not hear, and let it come.\nHe described the breathwork. It had felt like a panic attack in the body, and his intuition had told him not to go back. The practitioner confirmed what his instinct already knew: for someone whose system runs towards anxiety, that kind of breathing can push the body into the very state he was trying to leave. The slow breath he already used in the gym was the right one for him.\nThe one who watches notices how much of this was permission. All his life the mind went first, demanding the why before the feeling was allowed. Here the body was told it could go first, and that the why did not matter at all. Whatever wants to come, let it come. It is the same lesson as the sunflower and the sadness with no reason, arriving this time through the neck and the belly instead of through words.\nIf something old rises, find somewhere private and let it come for twenty seconds or two minutes, without working out what it was. He was told he might feel wiped out afterwards, and that this was the body finishing, not going backwards. Pause in the companion app uses the slow breath that suited him, not the intense kind."], ["24. Autonomy, Not Hope", "On 13 October 2025 he walked into Errol Jacobson\u2019s room with a theory. The bad patches seemed to come every two weeks. He had set it down as a rule, and then he had a good Friday and the rule broke.\nHe saw what he had been doing. The schedule, the plans, the I am going to do this and I am going to do that: they were all attempts to control and solve the thing. Laying an arbitrary expectation over a feeling only produces more anxiety, because the moment the feeling is late or early, the brain asks why it is not behaving. He did not know when it would come or go. He did know how to make it smaller, and that was by feeling it.\nHe had also been going to see a man for his foot who put needles in him and told him it was helping his anxiety. He would leave hopeful. A day later he would feel it again. The one who watches noticed the pattern before he did, and then he named it himself. It was the hope that he created.\nThat was the session\u2019s turn. He did not need hope. He needed to feel. Hope, he came to see, takes his power and gives it to something outside him, the practitioner, the protocol, the next appointment. Hope is good for a lot of things. In this, it does not work. In this, what works is autonomy. He cannot hope that one day he will do it himself. He has to do it himself, and over time it becomes second nature.\nSo he wrote his own procedure, in his own words. He no longer fears the feeling. He is going to check in on it. When it comes, he will go towards it, not away. First, one breath. Then he will label it. Then he will look at the photograph of himself as a boy and say: there he is. He needs compassion and protection. A few short kind statements, then a number for how strong it is, then stay connected to it some other way, a mindful moment, music, a gentle walk, until it is time to measure again.\nHe had already tested it. Somewhere that month the feeling arrived, and instead of shutting the door he welcomed it in. Nothing happened. It moved through him and passed, and at the end of it there was something close to excitement. It was like the bungee jump, like the cold plunge: you jump in without thinking, and afterwards it is an achievement.\nHe saw why the welcome mattered. Nobody tells a child not to feel, that we do not feel here, go and look at a screen. The old part of the brain cannot be taught by explaining. It can only unlearn by being allowed to experience. He let it experience, and it learnt.\nHe also caught himself in the familiar spiral. A good deal of his life had been spent being critical of being critical, rather than being aware that he was aware. He took the wrong car one morning and felt the urge to beat himself up for being distracted, and then the urge to beat himself up for beating himself up. He gave himself compassion instead.\nThe one who watches does not record this as a cure. The noise still came and went. What changed was who was in charge of the response. Not the man with the needles, not the next appointment, not hope. Him.\nA week later, on 20 October, the work sounded quieter. With Errol he came back to small, consistent movements, made patiently and with care. He did not need every encounter with himself to be a bungee jump. A little more time allowing the feeling, a little less time escaping it, and then the same choice again. The one who watches keeps this beside the jump. Courage could be an instant. Learning to be kind to himself would need repetition, and repetition did not have to be another ordeal.\nHis procedure can be anyone's: one breath, name the feeling, a few kind words to your younger self, a number for its strength, then a gentle walk or music until it is time to measure again. For him the feeling moved through and passed; on other days it simply grew a little quicker to recover. The Practices tab in the companion app sets out these steps as the Autonomy practice, one step at a time."], ["25. Giver and Taker", "On 24 November 2025, with Errol Jacobson, he looked at the shape of his relationships and saw a ledger that only ran one way.\nHe was a giver. He had always been a giver. And he noticed that givers feel safest around takers. With another giver he would feel uncomfortable, because if he could not give, he would not know how to be acceptable. So without ever deciding it, he had surrounded himself with people who took.\nIt came with a familiar hurt. Every so often someone he had been feeding would get cheeky, and when he pulled back they would turn on him, because there were plenty of others to feed them. He would be wounded each time, and each time he would give again.\nHe began to see the giving for what it partly was. It was generous, and it was also an acceptability measure. If he gives, they will say yes to him. Over-giving had a hidden cost. It never let his nervous system find out what happened when he did not give, and that he would still be accepted. Being a giver was a way of minimising rejection.\nThe answer was not to stop giving. It was balance. Still a giver, but at times not giving, and at times taking. Being able to say no. Being assertive. Being allowed to receive, and letting the old part of his brain see that he was not rejected for it. His wellbeing, he saw, was independent of all of it.\nHe could feel how much of his worth still came from outside. He was building his own supply, but most of it was still externally derived. That was why he stayed so vigilant about losing other people\u2019s approval, and why he would engage in strategies to keep it. It would change as he kept soothing his own feelings, because that is how autonomy is built: his own agency, his own freedom from the room around him. The more of that he built, the more his worth would come from inside.\nHe saw it even in the sessions themselves. Looked at from the outside, the arrangement benefited them both. Help could be received without a debt being run up.\nHis younger daughter taught him the same lesson from the other side. She is naturally giving. He saw that the pattern in him was not something his parents had done to him. It was something he had done to himself, and he did not want to pass it on.\nOut of that came the simplest practice in this book. Three times a day, set on the phone: how am I feeling at the moment? Not why. Not what should he be doing about it. Just the check-in. It is emotional regulation in one line, and it lets a person tell the difference between a gift that comes from a full place and a purchase that comes from not feeling very good.\nHe had gone through most of his life not buying himself anything, saving everything for later. By the end of 2025 he said he had emptied a great deal of the swamp, and that he wanted to keep emptying it.\nThis was the month he picked up the paintbrush. A man who could only give was about to make something for himself, for no one, and let it be enough. He had just been told he was allowed to receive. It turned out the first thing he received was from himself.\nSet three reminders a day that ask only: how am I feeling at the moment? He found it helped him tell a gift from a full place apart from a purchase made from not feeling good. The companion app's Today screen can send that exact question three times a day."], ["26. More Than One Tank", "On 27 October 2025, with Errol Jacobson, he found a picture for a life that had become too dependent on one thing. A diver underwater with one tank. If that tank leaked, there was nowhere else to draw breath. For him, the tank was work.\nHe had learnt early that work kept him and his family safe. It gave him competence, usefulness and somewhere to put his attention. It had kept giving him those things long after he could have stopped asking it for all of them. When work went badly, the difficulty was not only the problem on the site or the call that had not come back. Too much of his sense of himself was connected to the same supply.\nHe recognised something about the people he let close. He had often measured a connection by whether it helped the work. The question now was not how to find more useful people. It was how to make room for people without usefulness being the reason they were there. He was fifty-three. He asked how to begin.\nPainting offered a possibility. Someone he knew went to paint on Tuesday nights, and he thought about joining him. Not to acquire another skill for the portfolio, and not to become the business man in a different room. Simply to meet people around something he enjoyed. A week later, on 3 November, the need to give feeling room was still there. Nothing about having a possible Tuesday in mind made the Sunday work disappear.\nThe one who watches is careful with the picture. More tanks could become more acquisitions: a club, a new circle, another thing to organise and do well. That would leave the old arrangement intact beneath a busier calendar. Nor were people spare cylinders to be kept ready for an emergency. Belonging asked something different of him. He would have to be there without supplying the whole conversation or proving why he deserved the chair.\nThe small action available was to ask about the painting and consider going. The one who watches records an intention here, not a visit. There is no new room in this entry, no conversation to report and no evidence yet that he could leave his professional armour at the door.\nThere is only a question he can take with him. If nobody needed his help, and nobody asked what he had built, could he still enjoy being there? Work had given him a place in the world. It did not have to be the only place he could breathe.\nA reader can list the tanks they breathe from and ask whether one of them is doing all the work; then choose one small place to be without being useful. He has only an intention so far, and the one who watches makes no claim beyond that. Road in the companion app keeps the list of tanks, so you can see whether it changes."], ["27. The Loop", "T
