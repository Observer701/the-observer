ike to let that one have the wall for a minute instead of overriding them?"],["Background, not foreground","Pick something that has been at the front of your attention. Without fighting it, write three things that are plainly true right now that have nothing to do with it."],["Data and story","Write one fact from today. Then write the story you told yourself about it. Only one of them is fixed."],["Director, not critic","Are you grading your life after the fact, or shaping the scene you are in? Write one small way to direct the next hour."],["Inside, not outside","For fifty years he built what could be seen from the street. What have you built for other people\u2019s eyes, and what have you left unbuilt inside?"],["The paintbrush","After fifty years of building outside, he picked up a paintbrush. What is your paintbrush: something with no scoreboard, done only because it lets something out?"],["Feeling without fixing","Let one feeling sit in the room like a radio playing in another room. Do not turn it off. Write what it sounds like from there."],["Whose thought is this?","Is the worry you are carrying actually yours, or is it someone else\u2019s unaddressed mail? Write who it belongs to."],["Radical acceptance","Write one thing you cannot change this week. Then write one sentence that lets it be true without agreeing that it is fair."],["The gold is in the relating","Providing is the vehicle; relating is the cargo. Who could you simply be with today, without fixing or providing anything?"],["Love or fear","Under most decisions sits a quieter choice: love or fear. Which one is driving the decision in front of you?"],["Happiness is the way","Not the reward at the end, the way you walk now. Write one small thing to savour before tonight."],["Still on the road","There is no finish line here. Write where you are today, with the date on it. That is enough."]],_c=[["Author\u2019s Note: Who Is Telling This","This part of the book is told in the fourth person. The first book was John speaking; this one is told by the part of him that watches. It watches John living, it watches John watching himself, and every so often it catches itself in the act of watching and says so. He is aware that he is aware that he is aware. That is the voice. When you read he, it means John. When you read the one who watches, it means the observer telling the story. Where John\u2019s own words appear, they come from his journals and are his, inside the frame. The guides who helped him are named, but what they gave him is told as what he came to see, so that you can come to your own conclusions alongside him."],["Opening: Fifty Years, Then a Paintbrush",`For fifty years he built outward. Companies, buildings, a portfolio, a name. The one who watches can see it plainly now: almost every brick was laid with one eye on how other people would judge it. He measured himself by what could be seen from the street. Wealth was the scoreboard, and the scoreboard was always someone else\u2019s eyes.
Whenever the anxiety built, he opened a new spreadsheet and called it I AM HERE. Everything he owned, everything he owed, and the number between them. The name was the point. I am here. I exist. Do not forget me. The one who watches sees what he could not: the number was never about money. It was a man making sure he would not disappear.
In November 2025 he picked up a paintbrush and put the nine-year-old boy on the wall. Not to silence him. To sit with him, and let him have the wall. The canvas did not care about his portfolio, and for the first time the work turned inward.
It took him fifty years to find that the work he had never done was inside.
The one who watches did not exist yet, or not enough to speak. In a profile he sat in 2022, the capacity to step back and see his own experience without the emotion running it was the quietest thing in him by a long way. This book is that capacity, growing, telling the story as it grows. He is aware. He is aware that he is aware. And somewhere behind that, the one who watches is aware of being aware that he is aware.
At the end of the first book he left a question where anyone could see it. If I am not burning, am I nothing? He meant it. What follows is not an answer written from the far side. It is written from inside the change, while it is happening, and some of it will be wrong by the time it is read. Some of it he will have forgotten he believed. The one who watches has decided to leave those parts in. Its job is to record what was true at the time.
He spent his life grading the movie while it was still being made. Here, someone is finally watching it. And now and then the one who watches notices that it, too, is being watched.
The people who walked beside him through these years did not make him richer. What they helped him see had never once appeared on a balance sheet: internal balance. That the sound is data and the suffering is the story he writes about it. That rest is not a threat. That worth cannot be acquired. That the inner self, not the outer one, is where the work is.
There is no finish line. It is a road towards growth and acceptance, walked one ordinary day at a time. If there is a reason to tell it, it is that somebody else, in their own noise, might find a way through by watching how he found his.`],["1. The Scoreboard",`The I AM HERE files go back to April 2014.
A spreadsheet. His name at the top, the date, everything he owned, everything he owed, and the number sitting between them. Across twelve years, whenever the anxiety built to the point where he needed a figure for what was real, he opened a new one.
He never called them net worth statements. The name was the point. I am here. I exist. I have proof.
The one who watches can see what he could not. He needed the outside world to tell him where he stood, and the proof never lasted. A good fortnight had stopped counting by the time he opened the file again. The number was how he knew the nine-year-old sweeping floors for five dollars had not come back to take it all away.
They were never financial documents. They were proof of life, written for an audience of one man who never believed it.
The diaries say the same thing ten years earlier, in his own hand. On 2 September 2015 he headed a page Be Important and wrote that he wanted to be important, just like everyone else. Underneath he listed two things: \u201CThe Desire to be Important\u201D and \u201CThe Craving to be appreciated.\u201D He ended the page with an instruction to himself: give freely to receive freely.
The one who watches reads that page now and sees the I AM HERE files from the other side. The spreadsheet was the desire to be important, counted. The craving to be appreciated never had a column.
The work now is for him to know where he stands without counting. He is not there. But one week he went without opening the file, and he noticed that he had gone without. The one who watches noticed him noticing. That is the first entry.`],["2. The Bottom of the Well",`In January 2016 he sat with a worksheet that asked him to go seven levels deep on one question: what is important to you about achieving the ideal you?
He started where he always started. Real estate. So his children and theirs would not live a lifetime of toil. Down it went, one level at a time.
At the seventh level, underneath the investing and the providing and the generational wealth, was one line. To achieve a close, tight-knit family.
Not the number. Not proof that the basketball court had been wrong about him.
The one who watches sits with the distance between that line and the way the engine actually ran. The engine ran on the wound: Beach Ball, the boy in the pullover, the name a schoolyard gave him. The well ran on love, on Jenna, on Athena and Anastasia. They were never the same engine, and he never stopped long enough to check.
So there is a question he has to be able to look at. How much of what he built was pointed at them, and how much of the cost did they pay while he built it?
He is not ready to answer it fully. He can write it down where he can see it. That is the first thing the observer does. Not fix, not judge, not react. See.`],["3. Little Johnny, John and JJ",`In September 2017 he wrote himself a letter with three names in it. Little Johnny. John. JJ.
Little Johnny, he wrote, protects him from bullies and gives him certainty when times are desperate. JJ is the one in control, the one who built Synergy, the one who married Jenna. When Little Johnny is down and out, JJ is to change his state, take control and carry him on.
The last line told Little Johnny exactly where he could go.
That was how he ran: the frightened boy was the problem, and the answer was to override him. Fire for the fear, and more fire for the fire.
Reading it nine years later, the one who watches can see what the writer could not. The order to shut the boy up was the boy\u2019s own strategy, the habit of the kid picked last who learnt to push down what he felt so he could keep moving. It was the wound, borrowing JJ\u2019s voice, and it had been running so long it passed for personality.
In November 2025 the nine-year-old went onto a canvas. It did not silence him. It let him have the wall.
He has not fully made that shift. He still reaches for the override. The canvas is where he practises not reaching.
Two years before the letter, he had already tried to make peace with the boy another way. On 11 June 2015 he wrote a page titled I allowed that! so I can become this! He listed what the schoolyard had done to him, Beach Ball among it, and wrote that he had no other way out, that he hated school and was different, or at least was made to feel different. He wrote that he never asked for help and that his dad was never present in his youthful life. Then he turned it round: \u201CI became this so I allowed that.\u201D At the bottom of the page he wrote one word, breakthrough, and thanked Mr Green.
The one who watches does not grade that page. It was a man making the wound useful, which was the only thing he knew how to do with it then. It notices that even the peace was a transaction: the pain was allowed because of what it bought.
And the one who watches has seen something further. Little Johnny is not only the wound. He is also the engine. The boy who decided he would own the court is the same force that built Manufactor. The question was never whether to silence him. It was whether he could make something without first being made afraid.`],["4. Background, Not Foreground",`In June 2026 he began twelve Thursday sessions with Jay. He walked into the first with four things on the table: the ringing was louder and colouring his mood, he was stuck in a Groundhog Day of good days and bad days, the business was growing in spite of the stress, and a legal fight was still running.
Three problems and one piece of progress, and the one who watches could feel his attention handing the problems almost all of it. Noticing that was the first lesson. Not changing it. Noticing.
Over the next weeks he came to see that he counts. He wakes and checks the ear. He tracks the days. He grades each one. Every count drags the noise back to the front of the room.
He has worn glasses since his twenties and never thinks about them. They are on his face and not in his attention. It dawned on him that the ringing could go the same way. Not cured. Moved from the front of the room to the back.
So he built a small practice. On waking, he notices the reach to check the ear, lets it go, and writes down three or four things that are plainly true right now, without grading them.
The counting is still faster than the letting go. The reach happens before he is fully awake. But the gap between reaching and letting go is getting shorter. That is the one per cent, and he has learnt to count that instead. The one who watches has learnt to count it with him.`],["5. Data and the Dragon",`The tinnitus arrived in March 2025, eight months after his father died. For months he treated it the way he treats most things: a problem to solve, manage, beat.
Something concrete happens. The ear spikes, the cash flow moves, someone at work does not deliver. Those are facts. The moment he labels the fact unacceptable, catastrophic, proof that it is all falling apart, he has left the fact behind. He is in what he has come to call the dragon state: the body floods, the old survival wiring takes over, and a mind built to spot lions makes dragons out of a bank balance and a sound.
One morning he heard himself say that even his ear noise was a construct, that it did not really exist. The one who watches knew what he meant before he did. The sound is real. The suffering, the meaning stitched onto the sound, was something he was building. The sound is data. The dragon is the story he writes about the data.
In the first book he wrote that the ringing was fear dressed as sound. It was the truest thing he could say then. Now it reads more precisely: the ringing is data, the fear is the story, and the story is the part he gets to choose.
The dragon is not his enemy. It kept a nine-year-old moving through the industrial streets at dawn. But he is fifty-three and nobody is chasing him. Most mornings he forgets that before breakfast. More mornings than before, the one who watches reminds him.
He had described the dragon before he had a name for it. On 6 October 2015, sitting at the kitchen table, he wrote a page called Anxiety and noted that it had taken him a week to write about the subject. Anxiety, he wrote, makes us operate on a higher vibration than normal: he shook his foot, he picked his nails, and most of all he reacted to every thought he had. Then he wrote the line that reads now like an early draft of this chapter: depression and greatness are the negative and positive of the very same analysed thought.
Seven months later, on 13 May 2016, he went further. Meaning, he wrote, is what you give it, and once given it may have no effect on what is actually true. He closed the page with a sentence and a signature: \u201CThis is happening through me not at me.\u201D The one who watches finds that sentence nine years before the ear and leaves it here as evidence that the seeing was always in him. It simply had not yet been given the chair.`],["6. Director, Not Critic",`For most of his life he watched his own life the way a critic watches a film: wait for the end, then grade it. The deal closed, a good year. The tenant left, a bad one. Always the back row, always a scorecard, always late.
In a session in 2026 he described something he had not noticed was happening. The movie used to just be manufactured. In the last year he had begun to see every scene being played out, directed, redone and changed. As he said it, the one who watches recognised the whole of the shift.
A director is on set, inside the scene while it is made. He asks different questions. What is this scene doing? What is being learnt? What is the next right thing? None of them carries a score.
He saw that he had spent thirty years chasing success, which is a verdict, when what he loved was succeeding, which is a verb. Success arrives late and expires fast. Succeeding is in the scene, available every morning, including the bad ones.
The director frame did not settle everything. By August he would see that the director had been building the darkness on purpose to get the scenes made. That belongs later. In June the change was smaller and more useful: he had moved seats.
The one who watches is not a critic either. The critic needs the ending. The observer only needs to be present for the scene.`],["7. The Brewery and the Forge",`In June 2026 a session that began as a design briefing for the brewery precinct finished as a session about the dragon state. That is most of his days at the moment. The building and the inner work are not separate jobs.
The brewery is called Castlereagh. He knows what he wants it to feel like: communal industrial tables, a copper pizza oven inspired by the Imperial, dark tones and warm leather, a layout that makes people talk to each other. He has a word for that warmth and permanence: Hobjan. A place that is winter-proof and does well when others struggle.
That is the forge. The irons in the fire. The maker making. He is good at it.
The one who watches marked the moment the conversation moved from design to staffing. The dragon arrived on cue. New people on a hundred and thirty thousand dollars who needed constant checking. The old job of being the invisible quality-control layer, absorbing every gap with his own time. It watched the change move through his body mid-sentence, and for once he saw both conversations running at once. The one who watches saw him seeing it.
In June he believed the brewery was a beautiful problem, exactly the kind he was built for. That belief is left here as it was.
By the end of August he had said aloud, for the first time, that he is not a beer guy and never was. The brewery was where the old method stopped working: building something under pressure that he had no love for. It was also where the ear had been loudest. He owned a brewery and had spent a year treating the yeast as the problem without once looking at the brewing method.`],["8. Errol",`He sat with Errol Jacobson most Mondays through the second half of 2025. He would leave on a Monday feeling like Superman, and by the weekend the noise would be back and he would have forgotten the hard part: the work does not happen in the room, it happens in the week.
The first thing he saw was how much he was learning about his mind instead of living in it. Self-help in every spare minute, until one day he asked what all this work was for. He had turned healing into another job.
Then there was a Sunday. He sat around the house and felt guilty for sitting around, then guilty for feeling guilty. Followed back, it went to a boy cleaning factories after school until seven at night, and a rule written in that boy: I am safe if I work. Rest had never been neutral for him. Rest was exposure.
Food too. By March 2025, around the time the ringing arrived, he had brought his weight down to ninety-nine kilos. Food had been one of his oldest ways of soothing himself, and he had taken it away. The one who watches can see that some of what rose that year was simply feeling with nowhere left to hide.
He learnt the difference between the part of the brain that reasons and the older part that reacts. Flooded, he had been asking the reacting part to analyse. So he wrote the thought down and read it twenty minutes later. Nearly every time, it had been written by the alarm.
Then the word over-responsible: at home, in business, with family, with tenants. He looked it up and found arrested development. He thought it was a band. It describes a child made into a parent too early, and he recognised the boy who had looked after everybody.
The hardest thing was that he had lost trust in himself through the business years, and that losing it was tied to finally letting go of perfection. He had always believed he inspired people. With Errol he wondered whether he had really been trying to inspire himself, and whether what he craved from outside could only come from within. Worth cannot be acquired. He could own half of Australia and still not have it. This was the first place the one who watches understood that the guides were not helping him build more. They were helping him find balance.`],["9. Jodie and Paula: Feeling Without Fixing",`Jodie Lowinger and Paula met him in the worst of it, in May and June 2025, when the noise was in front of everything and he was treating his anxiety like a business problem to be closed out by the end of the quarter.
He began to do something very simple. When a worry arrived, he stopped and asked whether it was real. He could be sitting safe in a room, eating, talking with someone who meant no harm, and his body would be braced for an attack that lived entirely in the future. No threat. So why the fear? Asked over and over for a couple of weeks, that question did more than any protocol he had bought.
The one who watches noticed how uncomfortable he was spending money on himself. The flinch was still there every time. The same scarcity, in a nicer jacket.
The image that stayed was a radio in another room. Some days louder, some quieter, playing in the background while he got on with his life. Acceptance took him out of the boxing ring with the sound. Fighting it had kept it on stage.
He learnt that every time he talked about the ringing to people with no reason to carry it, he gave it strength. So he stopped. Not denial. Just no audience.
He saw what the anxiety did to who he thought he was. All his life he had been sharp, never forgetting a thing. When he walked to the fridge for the girls\u2019 drink bottles and forgot why, he questioned everything. That was the perfectionist talking, not the ear.
And he already knew something from business: issues never last. Time moves everything off the stage eventually. He did not need to drag it off. He needed to stop holding the spotlight on it.
The first night he slept with nothing in his ears, nothing had been fixed. He had simply stopped guarding the door.`],["10. Linda, Chris and the Body",`By the middle of 2025 he could explain his anxiety better than most people can explain theirs. His body had not read any of it.
He worked with Linda Wallace from late May through September 2025. Early on, the idea of the observer came up and it stuck. He wanted to be an infant again: calm, grounded, simply watching what came in. Of the questions he had collected along the way, the last was the one he needed most. If he cannot control what is about to happen, he can get okay with it. What else is there to do?
He came to see that his sense of safety had been tied to control and certainty his whole life. He had built an external facade for security. The work was to be with uncertainty from the inside, so that feeling safe no longer depended on being in charge. That is what internal balance means here, and it is the opposite of what fifty years of building had trained him to want.
He started to say thank you. On his Excel sheet, of all places, he wrote thanks for fifty-two and a half years of perfect hearing in his left ear. It was very hard to write. It turned the ledger from what he had lost to what he had been given. The one who watches notes the irony that the first honest thing he wrote in a spreadsheet was not a number.
At the end of that work were three reflection questions, all asking the same thing: what did he gain, what did he learn, what is he taking away. He is still answering them. This book is part of the answer.
Chris took him into breathwork, ninety-four minutes on a floor. Beforehand he admitted something he rarely says: people see him as strong, a bit of a caveman, but he is very vulnerable to his own judgement of himself. Then he breathed, and his mind offered every excuse to stop: the toilet, hunger, irritation. He learnt that these were the self-preservation reflexes trying to keep him where he was, and that the release lay on the other side of them. He had been a pressure cooker for decades, and every coping mechanism had been a lid, not a valve.
With Dr Kate, in June 2025, he said aloud something he had not faced. His father had died at ninety-five and he had not grieved him. Just before the ringing began, a family exchange about Dad\u2019s rings had ended in words from his brother that no one should send. Weeks before that, his journal said he was tired of listening to people. He began to see the ear as a barometer of everything he was carrying. The body had been keeping the account even when he was not.`],["11. Daniel: What the Hardware Is Doing",`Daniel Fetchner spent three and a half hours with him in 2025, the best appointment in a year of appointments. By then he had seen something like two dozen specialists, from the heart to neurology.
In the first book what he took from Daniel was that fear is the absence of knowledge. What came after was quieter. Hearing and the emotional brain are wired together far more tightly than he had imagined. A change in the ear does not stay in the ear. It can unsettle a person completely, and none of that means something is broken.
He was asked what percentage of his waking time he was aware of the ringing. He had never measured it that way, only by how bad it was, never by how often he noticed. The one who watches registered the shift at once: from volume to attention. Attention was the thing he could work with.
He wore the hearing aid every day for a while. At his daughter\u2019s event he found it extremely annoying. He wanted to move forward without it, and in time he did. The device was support while he relearnt, not a cure to depend on.
Something else surfaced that had nothing to do with hearing. When the matter with his brother resolved, he saw it had been about boundaries all along, and about the meaning he chose to give his brother\u2019s words.
The fear underneath it was older than the rings. On 23 August 2015, his brother\u2019s birthday, he wrote a page on love and fear and set down the plainest sentence in the diaries: he feared finding out that his brother did not love him or want to love him. Fear, he wrote on the same page, is not knowing whether there is love there. The one who watches sets that beside the words that came a decade later and does not draw a verdict. It notes only that the boundary was being drawn around a very old fear.
He said one thing in those sessions that the one who watches keeps returning to. The ringing woke him up. His body said, listen to me, and if you do not, you will listen to me anyway. He had done everything there was to do and learnt where he stood. After that, it was his turn to change.`],["16. The Weekend",`The experiment ran before he was ready for it.
The weekend of 13 and 14 September 2026. No reason to paint. No dark corner, no pressure looking for a way out, nothing hanging over him. He painted an enormous amount, and he found himself simply inspired, without any of it.
Without. The one who watches stopped on that word.
For thirty years there had been one set of evidence: the fire works. It built everything he owns and everything he is proud of. There had never been a single piece of evidence the other way, because he had never once tried. As of that Saturday there was one. Small, unglamorous, impossible to argue with.
He made a great deal of work from a still start, with nothing lit underneath it, and his family in the room. The close, tight-knit family at the bottom of the well was not a target on the far side of the next build. It was happening there, in the rumpus room.
Afterwards he noticed the difference. Working out of the fire, he manufactures a state, works out of it, and pays the bill later in his ear and his sleep. That weekend there was no manufacturing step.
For years his line had been that he inspires others to do what inspires them. That Sunday it turned around: sometimes it is the lack of inspiration that should get us up and moving. He did it first and noticed afterwards. The one who watches has learnt that this is the only order in which he ever believes anything.
The question had been waiting in a diary for seven years. On 7 September 2019 he drew the word MUSIC across a whole page, with the word IN underneath, and wrote two lines below it. Will you die with the music within you? Is your music no-where, or is it now here? That weekend in September 2026, some of it came out, now and here, in the rumpus room.
One data point. Not the end of the fire, and the fire is not the enemy. But it is no longer the only way in. Fifty years outward, and here was a weekend spent entirely inside. It has been written down, with the date on it.`]],Ac=[["12. The Loop",`Two more things came out of the session on 31 August, and the one who watches wants both on the record.
The first was the loop, closing in front of him. He had said, more than once, that he paints to soothe himself. That day he put the two halves into one sentence. He takes himself to the dark place in order to create. Then he paints to soothe himself in the dark place. Said together, the shape was obvious. The strategy manufactures its own demand. The fire produces the work, and the work is needed to put out the fire. A closed system, and one that will keep asking for more fire, not less. Nothing in a loop like that can be interrupted from inside it.
He has tried willpower. He has tried mindset. Every January resolution, every raise-your-standards, every burn-the-boats has lasted exactly as long as it took the next build to start. He tried the discounting practice, the reset protocol, the observer journal. All of them were aimed at the anxiety, which is to say at the symptom. Nobody had touched the method, and the method is what built everything. He saw that he had been using the loop to try to break the loop.
The second thing was evidence that something new was already working. Over the weekend of 16 and 17 August he had found that white noise took the edge off and reset him. Nobody handed him that. It came out of a question he had been asked to carry through the week: what triggers me, what does not, what did I learn. He ran it on himself through four loud days and it produced a result. What struck him afterwards was not that the white noise softened the ringing. It was the first thing he had ever done to the ear that was not counting it.
And then the piece neither of them could walk past. On the Monday morning he could barely hear his ear. Thursday through Sunday it had been profound. He made the argument himself, in the room, without help. You cannot have a broken knee that switches off on a Monday and back on by Thursday. If the structure were broken, it would be broken on Monday too. The ear was reporting the state, not the structure.
The one who watches marked it as the first time he had built the outside view with his own hands. No Errol, no doctor, no audiobook. A third-person argument about his own body, made from his own evidence. The observer chair being made rather than borrowed.
What the instrument reported across that weekend was the state the method produces: the charge building, the pressure rising, the creative cycle in its accumulation phase. By Monday morning the brew was done. The tank was quiet, and the ear went quiet with it.`],["13. The Expert and the Achiever",`Jay\u2019s plan of 31 August mapped two things sitting at different levels in him, and it explained why the gap between them had been survivable for thirty years.
Outwardly he operates as an Achiever. Vision 100, Global 90, Abstract 80, Options 80. He sees whole systems that do not exist yet and then brings them into being: a services business built and sold, a property portfolio, a brewery, a gallery, a book.
Underneath, the meaning-making sits at Expert: specialised, technical, early third person. A management style of instructing at 81 per cent. No patience for people he judges as slow. Doing most of the work himself and constantly checking. He recognised that as the Expert\u2019s shadow, precisely.
What came clear on 31 August was the most useful thing in the whole plan. The Expert makes certainty by mastering the detail. When something cannot be mastered in detail, because it takes two years, or depends on five other people, or is a market rather than a build, the structure has nothing left to make certainty with. So it substitutes pressure. The pressure cycle is not a quirk of personality. It is the bridge the Expert has been throwing across a gap that an Achiever would not need to cross at all.
The fire is the bridge. And the honest thing to say is that the bridge has worked. It has never once failed. It built everything he owns and everything he is proud of. The question he was left holding was not whether the bridge works. It was whether he could build a road.`],["14. Same, Same, Same, Same",`In a session he was told he runs a massive difference pattern. The 2022 profile said the opposite: Sameness 90, Difference 50. Both turned out to be true, and seeing how is seeing the pressure vessel.
Sameness 90 means he tolerates repetition. Same, same, same, same, he said, four times over. He does not go looking for novelty. He endures the familiar, and the enduring is what builds the charge. Then difference discharges it. A week on canvas becomes a week drawing on paper in front of a screen, and the only reason he can give is that it is different. In his system difference is not a preference. It is a release valve. That is why the creative expression always arrives on the far side of the same, and why he has never been able to get to the expression without first building up the same.
Set that beside his horizon. Short term 100, long term 35, and long term, for him, means two weeks. A fortnight is his far horizon. The back land took two years: roughly fifty-two far horizons in a row, each one needing its proof supplied again, because Sceptic 80 lets evidence expire after forty-eight hours. No wonder it cost what it cost. And the ear had done the same thing that week: quiet Monday, profound Thursday to Sunday. The same two-to-three-day grid, in a third domain.
The one who watches reads the numbers and sees a machine. Not a character flaw. A machine with a known cycle, a known charge time, a known discharge and a known invoice. The judger reads the same numbers and sees a verdict. Most of this book is about learning to read them the first way.`],["15. The Type Four Creative Strategy",`What came out on that Monday was Type Four, through and through, and he wanted to understand exactly why.
Fours hold, usually without ever examining it, that depth comes from the wound. That beauty comes out of melancholy. That the real thing only shows up once the feeling is intense enough to earn it. It is not a story he told himself once; it is the engine room of the type. On 31 August he stated it as a plain fact about the world, the way you would say water boils at a hundred degrees: when he is in a dark space, he does it a lot easier. Every artist myth he had absorbed agreed with him. Bacon, Kahlo, Basquiat, Munch. Which is exactly why it had never been questioned.
The Three wing makes it pay. The Four supplies the fire and the Three turns the output into evidence of a life: Manufactor, the brewery, the gallery, the book, the land out the back. This is why the strategy had survived unexamined for thirty years. It works.
There is a comparison that keeps running in him. The Four\u2019s passion is envy, less about wanting what others have than about measuring his own life against an imagined other. On 31 August the other was Mountain Culture. For once he used the comparison well: not to find himself wanting, but to find what was missing, which was the vision. Their small brewery in the mountains had only ever been a means. His had become the end. That stopped him.
Then he said a sentence out loud for the first time. To be honest with himself, he is not a beer guy, so he never was a brewery guy. Building something under high pressure that he has no love for is the Four\u2019s strategy applied to material the Four cannot draw meaning from. The most expensive version of the loop available. And it is exactly where the ear had been loudest.
The direction of growth runs the other way. The Four\u2019s virtue is equanimity, and it grows towards the One: grounded, present, doing the next right thing to a standard whether or not the feeling has arrived. The type says the feeling has to come first. The One says do it anyway; the feeling is not the qualification for starting. So creating from presence is not a relaxation technique. It is the direct contradiction of the belief that runs the type. He knew straight away it would be hard, and he said so.
He also saw the trap waiting. The Three wing will want to turn all of this into a performance metric. Is he doing the log well? Is he creating from presence yet? How is he tracking? He had already said, on 24 August, that he is aware that he is aware that he is aware, and that he was trying to fix it. Observation has no completion state. If he catches himself grading the practice, that is the wing arriving, and the right response is to write it down as an entry rather than fix it.`],["16. The Four Objectives",`The plan of 31 August set four objectives. He came to read them not as instructions but as a map of the ground he was crossing.
The first is to find the source without the fire. The shift is from manufacturing darkness in order to create, to creating from presence, stillness and centre. What he began to see is that the creativity is not produced by the fire. The creativity is his. The fire is only the permission slip, the thing that makes it acceptable to his system to start. The practices are small. A source log: every time something is made over the fortnight, one line about the state that came before it. A cold start: three mornings a week, fifteen minutes, before checking the ear or the phone, make something from stillness. And hopscotch: rules read, chalk down, two games, with Anastasia if he can. A one-minute test of the entire idea. It is very hard to grade yourself in front of a child.
The second is to wash a decision rather than chew it. The shift is from chewing until he can no longer say no to himself, to deciding from four perspectives on a timeline he sets. First his own view, with everything being chewed written out, including the most honest thing he had said, that he is not a beer guy, because it belongs inside the decision, not underneath it. Then the view of the people on the other side, with the good intention behind each. Then the facts and only the facts. Then the whole system around it. And before any of that, one page answering what the beer is for. Until he picks, people are working hard towards a target nobody has written down. The step that matters most is the last: rewrite the model in his own words and his own handwriting. Not being handed the rules. Writing them.
The third is to build the observer chair. The shift is from being inside the state to standing outside it and describing it without a verdict. Four lines at the end of each day about John in the third person, like a camera in the corner that records and does not comment. A thirty-second body pass in the morning: tinnitus, present; warmth in the chest, present; then get up. One line a day on the ear: how loud, what state, what load. Not to fix it. To watch it. If the pattern holds, the evidence will be in his own handwriting with the date on it, and the sceptic in him will not be able to throw it out.
The fourth is to count the learning and load the resistance. The shift is from grading the day once it is over to counting what the day and its resistance taught. One line every evening on what John learnt about John. Every second Sunday, read the last fourteen lines in one sitting. Three times a week, at the moment something obstructs him: what resisted me, what is it asking me to grow, what will I do in the next ten minutes. He goes to the gym; he knows what a rep is. The weight has to resist or nothing happens. The measure that matters is not mood but time to recover: two weeks, then four days, then two or three.
Four objectives, one piece of work with four faces. Nothing moves for long unless all four move together. The one who watches is beginning to understand why.`],["17. The Third Person Journal",`The camera-in-the-corner practice began in June, and he has run it since, not every day, but more days than not.
What he notices is how strange it is to write about himself in the third person after fifty-three years inside the first. The I is so automatic that switching to John feels artificial at first, like watching a recording of himself and not quite recognising the man on screen.
That is the point. The recording does not lie. John woke at five-thirty. John reviewed the cash flow. John caught himself catastrophising about the winter cycle and went back to the forecast he wrote in 2019, which had already named this period. John spent forty minutes on the design brief for the Melter room. John painted for an hour in the late afternoon and did not check his phone once.
No verdict. Just the record.
The record is kinder than the judge. The judge asks whether he performed, whether he advanced, whether he proved he is worth what he has built. The record says he showed up. He did things. He caught the pattern twice and let it go. He painted. That is what happened today.
He has journalled for twenty-five years, and journalled well, but always from the inside. This is the same habit with the camera moved. He is learning that the observer is not a critic. It is a witness, and a witnessed life is different from a graded one.
The diaries hold the proof. On 30 March 2016 he headed a page I am aware that I am aware, and the first line runs one step further: I am aware that I am aware that I am aware. He wrote that it would be near impossible to be aware one hundred per cent of the time, but that even ten per cent would create the life one really wants. On the same page he wrote that a monk is as successful as any billionaire, because the monk has no expectations.
When he said the same sentence aloud in August 2026 he thought it was new. The one who watches found it ten years earlier, in his own handwriting, with the date on it. The voice telling this book had been trying to speak since at least March 2016. It took the ear, the guides and a paintbrush to give it the room.
From 31 August a line on the ear joined it. How loud this morning, what state, what load. The ear as an instrument, not a problem. If the pattern holds, quiet Mondays and loud Thursdays to Sundays, the same grid showing up in several parts of his life, the one who watches will have built its strongest piece of evidence with its own hands.

Father Who Art

A church bell is not a warning. Nobody hears it and thinks danger. They hear it and think: it is time, come now, the service is starting. A minaret does the same work in a different register, the call to prayer sung across a city five times a day, not asking whether you feel like coming, simply announcing that the hour has arrived and what you do with it is your decision.

His father had died on 1 August 2024, at ninety-five. Eight months later the virus came, and the ringing with it. He had already said he did not mourn him. That day he began to see what an unmourned loss does. It goes under the surface and stays there, and a man who wants to be everything to everyone pushes it further down, until the pressure has nowhere to go but out through the body.
So he described his father. A placid man. Peaceful, never a fight with anyone, holding his ground without raising his voice. He had travelled the world when he was young and worked on cruise ships. He was never one for hugging his children, and never seemed to be there for them. His mother carried the ambition in that house. For as long as he could remember, he had said that his father taught him the kind of person he wanted to be and the kind of father he did not want to be.

The one who watches holds both of those images side by side. The soldiers are the old engine: money as an army, the world as cities to take. The truck is something newer. It is a man trusting what he feels before he can prove it, and finding that not knowing does not kill him. He would not have the words for it for years. Linda would one day tell him control had never been there. In 2019 he was already standing at the kerb, listening.
He also said he was asking himself how much more money he needed to keep making. He wanted to enjoy his life. He was taking Jenna and the girls overseas for two months, to Greece and Cyprus, and he said it felt like connecting with the past.
Then he said something harder, and the one who watches will not leave it out. He told Victor he divorced his wife in his head at least once a day. If she did not do what he wanted, it took nothing. In the same breath he said they had a good marriage, that in seven years they had argued once or twice, that she was peaceful and never thought that way at all. He had picked one word out of everything he had heard that day and kept it: ruthless. He said it fitted him, even with people less fortunate than himself.
He described two separate lives. He brought in the money; Jenna ran the house and the girls. He said she always carried tension in her shoulders and that he was always massaging them. She had grown up in a family where speaking up was not encouraged, and when someone pushed her she agreed, then wished afterwards that she had said what she really thought.
The one who watches reads that page now and sees two people who learnt the same lesson in different houses. She learnt to keep the peace by swallowing her words. He learnt to keep himself safe by making his decisions alone and fast; all his good decisions, he said, were quick ones. Neither had been taught to say, out loud, what they felt and wait to be met.
He did not see that in 2019. He saw a quiet wife and a restless husband and a marriage that worked. What he could see was that the soldiers were tired, and he could hear the truck. That was enough to stop him crossing.`]],Zo=$t.findIndex(e=>e[0]==="3. The Bottom of the Well")+1,ei=$t.findIndex(e=>e[0]==="4. Little Johnny, John and JJ")+1,Yo=$t.map((e,t)=>t<Zo?t:t<ei?t+1:t+2),lt=(()=>{let e=0;return[...$t.slice(0,Zo),Oc[0],...$t.slice(Zo,ei),Oc[1],...$t.slice(ei)].map(([t,n])=>/^(\d+|X)\. /.test(t)?[t.replace(/^(\d+|X)\. /,`${++e}. `),n]:[t,n])})(),Jw=Object.fromEntries($t.map((e,t)=>[e[0],lt[Yo[t]][0]])),Fr=[...Tl.slice(0,Zo),"Where in your life are you still saying \u201CI always move ahead\u201D when you could simply stand back and watch? What would letting go look like, if it did not mean throwing anything out?",...Tl.slice(Zo,ei),"What truck can you hear that you cannot yet see? And who in your house is keeping the peace by swallowing their words, while you make the decisions fast and alone?",...Tl.slice(ei)],Dr=[["X. A Hundred Miles an Hour",`On 26 May 2025 he sat down with Linda Wallace for the first time and found that he already had the picture. He had been driving at a hundred miles an hour for most of his life, building himself up financially, and the car had crashed. He was not on the road any more. He was in the air, spinning, waiting to see how he would land.
He had never used that image before. It arrived whole, and he knew it was the truth.
He could see what the driving had cost. He did not get to enjoy any of his life. He still lived as though he were starting from nothing. He had read Anthony Robbins and Brian Tracy young, planned his life and raced it, and somewhere along the way he had stopped checking whether the direction was one he wanted. What he did at twenty-nine he did at thirty-nine, and what he did at thirty-nine he did at forty-nine. He had traded most of the buildings he had built. Now, at the halfway mark, he did not have to do any of it again. So what was it for?
He said the rest plainly. It is lonely at the top. He owns the company and answers to no one. He is in a car by himself, a driver driving, and the friendships he does have tend to be with people who need his help, until the advice has been given fifty times and the friendship has turned into somewhere to talk. He wanted to spend more time with people for who they are, not only for what gets done.
He named his thoughts as the thing that had got him there. He wakes with twenty or thirty seconds of negative thinking, as far back as he can remember, and then he pushes, positive and pushing for the rest of the day. He had begun to notice that pushing is very tiring. Something else might need to come towards him instead.
And near the end, almost in passing, he said it. Maybe he needed to be an artist. He loved drawing. He had always drawn. He had trained in architectural drafting, could never work for anyone else, and had gone into buildings because that was where the drawing could earn. He felt something move as he said it, even then.
The one who watches marks this as the first entry of that year. The man in the air did not yet know where he would land. He knew only that the speed had been the problem and not the solution, and that the ear was knocking like a barometer, bang, bang, bang, telling him so. Every later chapter of 2025 starts here, with a car off the road and a man who, for once, was not steering.`],["X. The Cylinder and the Sunflower",`On 1 September 2025 he was asked to draw the shape of his life before.
He drew a cylinder. It had no end. The routine was the same every day, in every day and out every day, almost prescribed. Beside it he wrote the words that belonged to it: just go on.
Then he looked at what he had drawn and laughed, because it looked like something he would not say in polite company, and he said it anyway. The joke turned out to be accurate. It was protection. Put the blinkers on, do not let yourself feel, do not worry about whatever happened, keep going. It had kept him safe and it had also been suffocating. Underneath the blinkers he found a sentence he wrote down straight away: the fear to realise. The fear of realising that there was life outside the cylinder, and that this was not what reality was.
He could trace it back. In years seven to twelve a teacher, Mr Green, gave him a key to the technical drawing room, and he spent recess and lunch there, mostly alone. He saw it now as his way of staying unseen. At home he did not ask for clothes, because his parents could not afford them and he did not want to put pressure on them. He wore his brother\u2019s shirts stretched over him and a school jumper in summer. Underneath the house his parents were renovating for six years, he stapled the central heating to the floor by himself, and when he asked himself why, the answer was recognition: if they were happy, he would be safe. When he was a boy sweeping factories he saved up nine hundred dollars, and they took it. Not being seen, he realised, was the other face of wanting to be seen.
The better shape came to him as a sunflower. He was at the centre of it, with agency, and around him were the parts of a life held in balance: love, the spiritual, the financial, the physical, the emotional, and feelings with a petal of their own. One was a prisoner, he said. The other was a free spirit, growing in the sun. He had been sitting in the sun that very afternoon.
Then he was asked what the John of 2005 wanted him to remember, the John who had come through testicular cancer and walked out of that year with enormous agency. He wrote: remember my future and forget the past. It explained why he had been so future focused ever since. He could see the cycles now. Spiritual until about thirty-two, when he had thought of becoming a monk and stayed for his mother. Financial from thirty-two to fifty-two. And now, he felt, the physical and the emotional.
He also saw the cost of the financial cycle. By March 2025 he had reached every goal he had set for the age of fifty. He had not celebrated a single one. He had properties, cars, children, everything, and it was empty. A week earlier he had put it more bluntly still. Full on everywhere else, he was no different from a homeless person who is empty, because emptiness in any one human need is still emptiness.
The one who watches can see the sunflower he would come back to all that month, the one that interrupts the go-on part and says look at me. The sunflower did not replace the cylinder by force. It grew where the blinkers came off. He knew, too, that a drawing of a sunflower is still theory. Until he lives it, physically, he said, it is only a picture. The work was to become it.`],["X. The Wizard Pulls",`A week later, on 8 September 2025, he came back with the Wizard of Oz.
The yellow brick road had first inspired him years before, and back then it was about business. Now he saw it as the road of internal worth. The Emerald City was all external, shining, the thing you get drawn to. The values he had chosen to walk with were growth, wisdom and vision, and none of them could be seen from outside. You cannot shine wisdom off yourself. It grows inside.
He was not comfortable with the line about the journey mattering more than the destination. If it was never about the goal, why do the journey at all? The only answer he could find was that he would have to become one with uncertainty. Nobody knows. All there is, is the road.
Then the picture turned around. There was the wizard, the John of 2045. There was the John sitting in the session. And there was the five-year-old whose photograph he looks at every day. All his life he had pushed his way to wherever he was going. Now he saw that the wizard could pull him there instead, and that it is easier to pull than to push. That was why wisdom was one of his three values: to be the wizard, open enough and attuned enough to let himself be called.
It linked to the sunflower without his trying. The sunflower turns to the sun because the sun draws it. The plants outside his house all grow towards the north for the same reason. It is a natural attraction, and it is effortless. The word landed on him: effortless. For a man who had pushed everything, it was a new way to move.
Under all three values sat one word he kept returning to. Inspiration. He knew he inspired people. He realised, there and then, that he had been craving to be inspired himself, and that he had been looking for it in the outside world, where another Rolls-Royce or another purchase only lasts as long as the last one. Inspiration, he saw, has to be felt within. He decided to go looking for it more consciously, cherry-picking what moved him in people and places rather than waiting for one perfect role model who may never exist.
He also caught the perfectionist at work. He had left his card upstairs and beaten himself up for it, while everyone around him forgot things all day long and simply laughed. Perfect him measured everything: how he presented, how he looked, how he spoke, how he dressed. Perfection brought control, and control was an attempt to forecast and manipulate the future. He saw that demanding perfection of everyone around him was a guaranteed failure, and that losing trust in himself had come from the same place.
And he saw the parentified boy in his over-responsibility. Over-responsible adults attract under-responsible people. He had been learning to say no. His younger daughter had taught him that, after a bedtime argument in which he had said yes when her mother had said no. He told his staff to sort things out, and to come to him only if they could not. He was learning to let them grow.
He named one more thing that week, and it was the hardest. When people praised what he had built, he did not let it in. Receiving had always been hard for him. The one who watches holds that beside the wizard. A man who cannot receive a compliment is learning to be pulled, and being pulled is only receiving, at the speed of a sunflower.`],["X. Let It Come",`There was one session that was not about talk at all. In a cranial session in 2025, a practitioner worked through his body and reported what was found. The fight-or-flight pattern that used to run busy and overactive around his belly had settled. The back had settled. The old compression around the left temple, which had been stuck before, was fine that day. What wanted attention now was high in the neck, and the instruction was simple and physical: keep doing the chin tucks, watch the posture, lengthen the back of the neck.
Then came the part he kept. Emotions that have been suppressed for a long time come up when they are ready. The deeper he went with this work, the deeper the material would be, more uncomfortable, more regressed. That was not a sign of going backwards. It was coming up because he was in a good state, because the body was feeling safer, and only a body that feels safe will let the old things through.
If something did come, a sadness or grief or anger or rage, he could let it out. It might be crying, or yelling, or a long string of expletives. It might last twenty seconds or two minutes, and he might feel wiped out afterwards. He did not need to look for it, pause it or think about it. He did not need to work out what it was, how many times it had happened or whether it was right. That was irrelevant. It was old, it had nothing to do with now, and it was simply the nervous system finishing what it had not been allowed to finish, probably for good reasons, many times, as a child and since. Find somewhere private, where the children would not hear, and let it come.
He described the breathwork. It had felt like a panic attack in the body, and his intuition had told him not to go back. The practitioner confirmed what his instinct already knew: for someone whose system runs towards anxiety, that kind of breathing can push the body into the very state he was trying to leave. The slow breath he already used in the gym was the right one for him.
The one who watches notices how much of this was permission. All his life the mind went first, demanding the why before the feeling was allowed. Here the body was told it could go first, and that the why did not matter at all. Whatever wants to come, let it come. It is the same lesson as the sunflower and the sadness with no reason, arriving this time through the neck and the belly instead of through words.`]],ti=lt.findIndex(e=>e[0]==="13. Am I Becoming My Father?"),ni=lt.findIndex(e=>e[0]==="16. The Way He Would Speak to a Child"),oi=lt.findIndex(e=>e[0]==="20. Autonomy, Not Hope"),Ko=lt.map((e,t)=>t<ti?t:t<ni?t+1:t<oi?t+3:t+4),Fc=(()=>{let e=0;return[...lt.slice(0,ti),Dr[0],...lt.slice(ti,ni),Dr[1],Dr[2],...lt.slice(ni,oi),Dr[3],...lt.slice(oi)].map(([t,n])=>/^(\d+|X)\. /.test(t)?[t.replace(/^(\d+|X)\. /,`${++e}. `),n]:[t,n])})(),$w=Object.fromEntries(lt.map((e,t)=>[e[0],Fc[Ko[t]][0]])),Vw=[["He worked with Linda Wallace from late May through September 2025. Early on, the idea of the observer came up and it stuck.","Across those months with Linda Wallace, from May to September, the idea of the observer came up early and it stuck."],["Underneath the house his parents were renovating for six years, he stapled","Under the family home, during the six years of renovation he had already described to Jodie, he stapled"],["He also caught the perfectionist at work. He had left his card upstairs","He also caught the perfectionist at work, the same one who had made him question everything when he forgot why he had walked to the fridge. He had left his card upstairs"],[" He saw that demanding perfection of everyone around him was a guaranteed failure, and that losing trust in himself had come from the same place."," He saw that demanding perfection of everyone around him was a guaranteed failure."],["Under all three values sat one word he kept returning to. Inspiration. He knew he inspired people. He realised, there and then, that","Under all three values sat one word he kept returning to, the same one he had been circling with Errol. Inspiration. He knew he inspired people. He realised that"],["He named one more thing that week, and it was the hardest. When people praised what he had built, he did not let it in. Receiving had always been hard for him. The one who watches holds that beside the wizard. A man who cannot receive a compliment is learning to be pulled, and being pulled is only receiving, at the speed of a sunflower.","He named one more thing that week, the hardest of them, and it belongs to the end of this book: he could not let praise in. The one who watches holds it beside the wizard for now. Being pulled is only receiving, at the speed of a sunflower, and receiving was the thing he found hardest of all."],["He never allowed himself to be the sunflower, wide open to the world,","He never allowed himself to be the sunflower he had drawn three weeks earlier, wide open to the world,"],["Uncertainty, it turns out, is livable. He has been living in it all along. He only just found out.","Uncertainty, it turns out, is livable. He had said as much in May 2019, hearing a truck he could not see, and had drawn the opposite in the cylinder a month before. He has been living in it all along. He only just found out."],["The one who watches sets this chapter just before the paintbrush. A man who could only give was about to make something for himself,","This was the month he picked up the paintbrush. A man who could only give was about to make something for himself,"],["Two more things came out of the session on 31 August, and the one who watches wants both on the record.","The session on 31 August 2026 produced two things the one who watches wants on the record."],["The one who watches notices this. It does not grade it. It writes it down, with the date on it, and keeps watching.","The one who watches notices this. It does not grade it. It writes it down."],["For thirty years there had been one set of evidence: the fire works. It built everything he owns and everything he is proud of. There had never been a single piece of evidence the other way, because he had never once tried. As of that Saturday there was one. Small, unglamorous, impossible to argue with.","The experiment in chapter thirty-two had been waiting for its first instance. As of that Saturday there was one. Small, unglamorous, impossible to argue with."],["One data point. Not the end of the fire, and the fire is not the enemy. But it is no longer the only way in. Fifty years outward, and here was a weekend spent entirely inside. It has been written down, with the date on it.","One data point. Fifty years outward, and here was a weekend spent entirely inside. It has been written down, with the date on it."],["His father\u2019s birthday is the fifth of October. He would have turned ninety-five, if turning had ever been the way he measured anything. He did not count years","His father\u2019s birthday is the fifth of October. Turning a year older was never the way he measured anything. He did not count years"],["With Linda he found something underneath that. When people praised what he had done, he blocked it.","With Linda, on 8 September 2025, he had found something underneath that. When people praised what he had done, he blocked it."],["He wanted to be seen, and he had arranged things so that being seen could not land.","He wanted to be seen, and he had arranged things so that being seen could not land. The boy with the key to the drawing room had made the same arrangement, staying unseen in order to be safe."],["Little Johnny is still in the room.","Little Johnny is still in the room, the one who watched the corridor, wore the stretched shirts and handed over the nine hundred dollars."]],U=Fc.map(([e,t])=>[e,Vw.reduce((n,[o,i])=>n.split(o).join(i),t)]),Rc=[...Fr.slice(0,ti),"Think of the moment you were going a hundred miles an hour. What were you alone with, in the car or at the top, and what does your own barometer tell you when you stop?",...Fr.slice(ti,ni),"Draw your own cylinder and your own sunflower. Which one are you living in this week, and what would take the blinkers off?","Who is the wizard in your life, the person you are becoming? What would it feel like to be pulled there instead of pushing?",...Fr.slice(ni,oi),"If something old wants to come up this week, where could you let it come, privately, without asking why?",...Fr.slice(oi)],Xe=[{id:"camera",t:"Camera in the corner",s:18,g:"Jay",w:"A witnessed life is different from a graded one. The record is kinder than the judge.",st:["At the end of the day, write four lines about yourself in the third person, using your own name.","Record what happened, like a camera in the corner that records and does not comment.","No verdict. If you catch yourself grading, write that down as one more line rather than fixing it."]},{id:"waking",t:"Three true things on waking",s:5,g:"Jay",w:"Counting drags the troubling thing back to the front of the room. This moves it towards the back, like glasses you stop noticing.",st:["On waking, notice the reach to check the thing that troubles you.","Let the reach go.","Write down three or four things that are plainly true right now, without grading them.","Count the gap between reaching and letting go getting shorter, not the problem."]},{id:"data",t:"Data and the dragon",s:6,w:"The fact is data. The meaning stitched onto it is the story, and the story is the part you get to choose.",st:["Pick one concrete thing that happened today: a fact.","Write the label you put on it: unacceptable, catastrophic, proof it is all falling apart.","Look at the two side by side. The fact stays. The label is yours to rewrite."]},{id:"twenty",t:"Twenty minutes later",s:9,g:"Errol Jacobson",w:"When flooded, the older reacting part of the brain is not the one to ask for analysis.",st:["When you feel flooded, write the thought down exactly as it arrives.","Put it aside for twenty minutes.","Read it again and ask who wrote it: you, or the alarm?"]},{id:"real",t:"Is it real?",s:10,g:"Jodie Lowinger and Paula",w:"Asked over and over for a couple of weeks, one simple question did more than any protocol he had bought.",st:["When a worry arrives, stop.","Ask whether it is real: here, in this room, right now.","If there is no threat, ask: so why the fear?","Let the feeling play in the background, like a radio in another room, while you get on with things.","Notice whether you are giving it an audience by talking about it to people with no reason to carry it."]},{id:"thanks",t:"A thank-you in the ledger",s:11,g:"Linda Wallace",w:"It turns the ledger from what was lost to what was given.",st:["Go to the place where you usually keep score.","Write one thank-you there for something you have been given, even beside something you have lost.","Notice if it is hard to write. That is part of it."]},{id:"attention",t:"Attention, not volume",s:12,g:"Daniel Fetchner",w:"He had only ever measured how bad it was, never how often he noticed. Attention is the thing he could work with.",st:["Stop asking how bad it is today.","Ask instead: what share of my waking time was I aware of it?","Write the answer down without a verdict."]},{id:"week",t:"Carry three questions through the week",s:13,w:"He ran these on himself through four loud days, and they produced the first thing he had done for the ear that was not counting it.",st:["Carry three questions through the week: what triggers me, what does not, what did I learn?","Ask them on the hard days as well as the easy ones.","Write down anything you find that helps."]},{id:"well",t:"Seven levels deep",s:3,w:"At the bottom of his well, underneath the investing and the providing, was one line: a close, tight-knit family.",st:["Ask: what is important to me about what I am chasing?","Take the answer and ask the same question of it.","Keep going, one level at a time, seven levels if you can.","Write the bottom line where you can see it. Then ask how much of what you are building points there."]},{id:"younger",t:"Let the younger one have the wall",s:4,w:"The order to shut the frightened boy up was the boy\u2019s own old strategy. The canvas is where he practises not reaching for the override.",st:["Notice when you reach to override the frightened, younger part of you.","Picture that younger you instead, and tell him it is safe to slow down.","Make something, and let him have the wall rather than silencing him."]},{id:"source",t:"Source log and cold start",s:17,g:"Jay",w:"The creativity is his. The fire is only the permission slip.",st:["Each time you make something, write one line about the state that came before it.","Add one word beside it: engine or essence.","Three mornings a week, for fifteen minutes, before checking anything, make something from stillness.","If it feels thin, that feeling is the belief being tested, not a report on your creativity."]},{id:"wash",t:"Wash a decision, do not chew it",s:17,g:"Jay",w:"From chewing until you can no longer say no to yourself, to deciding from four perspectives on a timeline you set.",st:["Before anything else, write one page on what the decision is for.","First your own view, with everything you are chewing written out, including the most honest thing.","Then the view of the people on the other side, with the good intention behind each.","Then the facts, and only the facts.","Then the whole system around it.","Set your own timeline, and rewrite the model in your own words and your own handwriting."]},{id:"body",t:"Thirty-second body pass",s:17,w:"Part of building the observer chair: describing the state from outside it, without a verdict.",st:["In the morning, take thirty seconds before you get up.","Name what is there without fixing it: this, present; that, present.","Then get up."]},{id:"instrument",t:"One line on the instrument",s:18,w:"The ear as an instrument, not a problem. The sceptic lets evidence expire after forty-eight hours; handwriting is the workaround.",st:["Once a day, write one line on the thing that troubles you: how loud, what state, what load.","Not to fix it. To watch it.","Put the date on it."]},{id:"rep",t:"Count the learning, load the resistance",s:17,g:"Jay",w:"The weight has to resist or nothing happens. The measure is not mood but time to recover.",st:["Every evening, write one line on what you learnt about yourself.","When something obstructs you, ask: what resisted me, what is it asking me to grow, what will I do in the next ten minutes?","Every second Sunday, read the last fourteen lines in one sitting."]},{id:"hopscotch",t:"Hopscotch, your rules",s:22,w:"A one-minute test of the whole idea. It is very hard to grade yourself in front of a child.",st:["Chalk down, two games, with a child if you can.","Do not wait to be handed the rules. Maybe making it up is the rule.","Notice what it is like to play without a scoreboard."]},{id:"maslow",t:"The Maslow sort",s:24,w:"The simplest instrument, which is exactly why it cuts. The test is satiation.",st:["On one page, list what you are building.","Against each, one word: deficiency or being.","A deficiency need goes quiet once it is met. A being value grows the more you have of it.","Anything that has never once gone quiet, however much you fed it, is telling you something."]},{id:"whose",t:"Who is this thought for?",s:29,w:"Carrying other people\u2019s thoughts is not the same as caring. What is left once they are handed back is smaller and far more answerable.",st:["When a thought arrives, ask: who is this thought for?","If it is yours, your decision, your fear, your consequence, keep it and sit with it honestly.","If it belongs to someone else\u2019s life, choice or consequence, hand it back, the way you return a letter delivered to the wrong house."]},{id:"gap",t:"Does this gap need me in it?",s:30,w:"The instinct that scans a corridor for gaps can, left unmanaged, scan every room and relationship for something to fill, fix or secure.",st:["Notice when you are scanning a room, a conversation or a relationship for something to fill.","Ask whether the gap actually needs you in it.","Some gaps, in people rather than markets, are meant to stay open for someone else to walk through in their own time."]},{id:"short",t:"A shorter conversation",s:27,w:"The feeling used to run for hours. Sat with and listened to, it finishes in minutes.",st:["When the hard feeling arrives, sit with it instead of fighting it.","Ask what it wants you to look at, and what part of your life it is really about.","Let it finish. Then, instead of dwelling, move."]},{id:"witness",t:"Seen without the why",s:32,g:"Linda Wallace",w:"The sadness did not need a reason. It needed a witness.",st:["When an old feeling arrives, notice the pull to go straight for the why.","Slow down. Find where the feeling sits in your body and put a hand there.","Let it know you see it and that it makes sense, without needing to understand it first."]},{id:"bell",t:"Hear the bell",s:31,w:"A church bell is not a warning. It says the hour has arrived, and what you do with it is your decision.",st:["When the noise rings, hear it as a call rather than a threat: attend to this now.","Notice the moment delay tries to install itself as prudence.","Walk towards the thing that needs doing, rather than waiting for the sound to stop."]}];Xe.forEach(e=>{e.s=__OBS10.Z[Ko[Yo[Qo[hn[e.s]]]]]});U=__OBS10.U;Rc=U.map((e,t)=>__OBS10.I[t]<0?__OBS10.N[t]:Rc[__OBS10.I[t]]);Xe.push({id:"letcome",t:"Let it come",s:U.findIndex(e=>e[0].endsWith("Let It Come")),w:"Old feeling comes up when the body feels safe. The why is irrelevant.",st:["If something old arrives, find somewhere private.","Let it out, crying or yelling or whatever comes, for as long as it lasts.","Do not look for the reason or pause it to think.","Afterwards, rest, and use a slow breath."]});Xe.push({id:"autonomy",t:"Autonomy practice",s:U.findIndex(e=>e[0].endsWith("Autonomy, Not Hope")),g:"Errol Jacobson",w:"Hope hands his power to something outsid
